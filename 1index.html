/* ======================= CASE WALKTHROUGH ======================= */
function walkthrough(c){
 const parts = c.steps.map((s,i)=>{
  if(s.type==="intro") return `<div class="wt"><h4>The question</h4><p>${s.referral}</p></div>`;
  if(s.type==="interview") return `<div class="wt"><h4>What the interview showed</h4><ul>${s.qs.filter(q=>!q.bank || asked(c.id).includes(s.qs.indexOf(q))).map(q=>`<li>${q.spared?"<b>Still works:</b> "+q.clue.replace(/^Spared: /,""):q.clue}</li>`).join("")}</ul></div>`;
  if(s.type==="results") return `<div class="wt"><h4>${s.label}: the pattern</h4><p>${s.pattern}</p></div>`;
  if(s.type==="q"){ const a=S.answers[c.id]?.[i]; const right=s.options.filter(o=>o.ok); const wrong = a ? a.sel.map(k=>s.options[k]).filter(o=>!o.ok) : [];
   return `<div class="wt"><h4>${s.label}: ${s.explain.title}</h4><p class="wq">${s.prompt}</p><p><b>Answer:</b> ${right.map(o=>o.t).join("; ")}.</p>${s.explain.body.map(p=>`<p>${p}</p>`).join("")}${wrong.length?`<p class="whynot"><b>Why not what you picked:</b> ${wrong.map(o=>`“${o.t}”: ${o.why}`).join(" ")}</p>`:""}</div>`; }
  return "";
 }).join("");
 return `<details class="walk"><summary>Explain this case to me, step by step <span class="opt-tag">optional</span></summary><div class="walk-body">${parts}</div></details>`;
}

function optRegs(o){ return [].concat(o.region||[]).map(r=>{ const [n,s]=r.split("@"); return {n, side:s||o.side||"L"}; }); }
function visRegs(o,H,V){ return optRegs(o).filter(r=>(r.side==="B"||r.side===H) && REG[r.n].v===V); }
function defaultView(step){ const o=step.options.find(x=>x.region); return o?REG[optRegs(o)[0].n].v:"lat"; }
const hemiFor = (step,a) => a.hemi||"L";
const viewFor = (step,a) => a.view||defaultView(step);
function focusOpt(a,o){
 const rs=optRegs(o); if(!rs.length) return;
 const V=a.view||"lat", H=a.hemi||"L";
 const r = rs.find(x=>REG[x.n].v===V && (x.side==="B"||x.side===H)) || rs.find(x=>REG[x.n].v===V) || rs[0];
 a.view = REG[r.n].v; if(r.side!=="B") a.hemi = r.side;
}
function brainMap(step, a){
 const H = hemiFor(step,a), V = viewFor(step,a);
 const selOs = a.sel.map(k=>step.options[k]);
 const regions = []; step.options.forEach(o=>visRegs(o,H,V).forEach(r=>{ if(!regions.includes(r.n)) regions.push(r.n); }));
 const selR = [...new Set(selOs.flatMap(o=>visRegs(o,H,V).map(r=>r.n)))];
 const okR = a.done ? [...new Set(step.options.filter(o=>o.ok).flatMap(o=>visRegs(o,H,V).map(r=>r.n)))] : [];
 const badR = a.done ? [...new Set(selOs.filter(o=>!o.ok).flatMap(o=>visRegs(o,H,V).map(r=>r.n)))].filter(r=>!okR.includes(r)) : [];
 const cls = r => okR.includes(r) ? "correct" : badR.includes(r) ? "wrong" : selR.includes(r) ? "sel" : "";
 const shapes = ORDER.filter(r=>regions.includes(r)).map(r=>`<g data-region="${r}"><title>${REG[r].label}</title>${REG[r].svg("rg "+cls(r))}</g>`).join("");
 const flip = (H==="R") !== (V==="med");
 const labelSet = [...new Set([...okR, ...selR])];
 const labels = (labelSet.length>2 ? [] : labelSet).map(r=>{ const R=REG[r]; const x0 = flip?400-R.lx:R.lx; const w=R.label.length*6.4+14; const x=Math.max(2,Math.min(398-w,x0-w/2));
   return `<g><rect class="blabel-bg" x="${x}" y="${R.ly-13}" width="${w}" height="20" rx="4"/><text class="blabel" x="${x+7}" y="${R.ly+1}">${R.label}</text></g>`; }).join("");
 const avail = [["L","lat"],["L","med"],["R","lat"],["R","med"]].map(([h,v])=>{ const n=step.options.filter(o=>visRegs(o,h,v).length).length; return n?`${h==="L"?"left":"right"} ${v==="lat"?"lateral":"medial"} (${n})`:null; }).filter(Boolean).join(" · ");
 const keyCls = r => ({sel:"on",correct:"ok",wrong:"bad"})[cls(r)]||"";
 return `<div class="brainbox">
  <div class="togs">
   <span class="hemi" role="group" aria-label="Hemisphere"><button type="button" data-hemi="L" class="${H==="L"?"on":""}">Left hemi</button><button type="button" data-hemi="R" class="${H==="R"?"on":""}">Right hemi</button></span>
   <span class="hemi" role="group" aria-label="View"><button type="button" data-view="lat" class="${V==="lat"?"on":""}">Lateral (outer)</button><button type="button" data-view="med" class="${V==="med"?"on":""}">Medial (inner)</button></span>
   <button type="button" class="chip-btn lmtog" data-lm aria-pressed="${a.lm!==false}">${a.lm===false?"Show":"Hide"} landmarks</button>
  </div>
  <div class="cap"><span>${H==="L"?"LEFT":"RIGHT"} hemisphere · ${V==="lat"?"outer surface":"inner surface, cut at the midline"} · front faces ${flip?"right":"left"}</span><span>${a.done?"Answer shown in green":"Tap a region"}</span></div>
  <svg viewBox="0 0 400 290" role="img" aria-label="Brain map: ${H==="L"?"left":"right"} hemisphere, ${V==="lat"?"lateral":"medial"} view">
   ${BRAIN_DEFS}<g transform="${flip?"translate(400 0) scale(-1 1)":""}">${V==="lat"?LAT_BASE:MED_BASE}${shapes}</g>
   ${a.lm===false?"":LANDMARKS[V].map(([t,x,y])=>`<text class="lm" x="${flip?400-x:x}" y="${y}" text-anchor="middle">${t}</text>`).join("")}
   <text class="blabel" x="${flip?350:14}" y="22" opacity=".6">FRONT</text><text class="blabel" x="${flip?14:356}" y="22" opacity=".6">BACK</text>
   ${labels}
  </svg>

/* Side labels for localization choices */
const MIDLINE = ["cc","ccant","splenium"];
function sideTag(o){
 const rs = optRegs(o); if(!rs.length) return "";
 const parts = [...new Set(rs.map(r => r.side==="B" ? (MIDLINE.includes(r.n) ? "Midline" : "Both sides") : r.side==="L" ? "Left" : "Right"))];
 const cls = parts.length>1 ? "mixed" : parts[0]==="Left" ? "left" : parts[0]==="Right" ? "right" : "both";
 return `<span class="sidetag ${cls}">${parts.join(" + ")}</span>`;
}
function locText(o){
 if(!o.region) return o.t;
 let t = o.t.replace(/^(Left|Right) /,"").replace(/,? (on )?both (sides|hemispheres)\b/i,"").replace(/ \((left|right)\)/i,"").replace(/ and (left|right) hippocampus/," and hippocampus");
 return t.charAt(0).toUpperCase()+t.slice(1);
}

/* ======================= FEEDBACK ======================= */
function verdict(p){
 if(p>=99) return ["All correct","All correct","Every call on this shift was right."];
 if(p>=80) return ["Strong work","Strong work","Solid reasoning, with a couple of calls to tighten."];
 if(p>=60) return ["You did alright","Alright","The big picture is there; the details need work."];
 if(p>=40) return ["Some gaps to work on","Some gaps","Review the explanations on the calls you missed."];
 return ["Needs another look","Retry it","Retry these cases and read each explanation."];
}
function ellisFeedback(c){
 const sc = caseScores(c), [v] = verdict(casePct(c));
 const hints = sc.filter(x=>x.a?.hint).length, cl = caseClues(c);
 const open = {"All correct":"All correct. You read the pattern, ordered the right tests, and didn't let a single score push you around. I'd sign this report.",
  "Strong work":"Strong work. Your formulation holds together; there are just a couple of calls to tighten.",
  "You did alright":"You did alright. You got to the right neighborhood, but some of the reasoning was guesswork.",
  "Some gaps to work on":"There are some real gaps in this one. Let's go through where it went sideways.",
  "Needs another look":"This one needs another look. That's fine: it's what training is for."}[v];
 const best = sc.filter(x=>x.a?.score>=0.99), work = sc.filter(x=>!x.a || x.a.score<0.99);
 const did = best.length ? `<p><b>What you did well:</b> ${best.map(x=>x.s.label.toLowerCase()).join(", ")}.</p>` : "";
 const workList = work.length ? `<p><b>Where to work on:</b></p><ul>${work.map(x=>`<li><b>${x.s.label}</b> (${x.s.explain.title.toLowerCase()}${x.a&&x.a.score>0?"; partly right":""}): ${x.s.hint}</li>`).join("")}</ul>` : `<p>Nothing to work on here. Keep reasoning this way.</p>`;
 let clueLine = "";
 if(cl.total){
  const skipped = cl.iv.qs.filter((q,k)=>!q.bank && !asked(c.id).includes(k));
  const skipLine = !skipped.length ? "You asked every core interview question. Thorough history-taking is half the job." : `You skipped ${skipped.length} of the core interview question${skipped.length>1?"s":""} (like “${skipped[0].q}”).${work.length?" Some of what you missed was in those answers.":" You still got there, but on a real case that history could matter."}`;
  const bankAsked = asked(c.id).filter(k=>cl.iv.qs[k].bank).map(k=>cl.iv.qs[k]);
  const odd = bankAsked.filter(q=>!q.spared);
  if(bankAsked.length) clueLine = `You also ran ${bankAsked.length} extra mental status question${bankAsked.length>1?"s":""}.${odd.length?` Good catch on “${odd[0].area.toLowerCase()}”: that answer was abnormal too.`:" All of them came back normal, which helps show the deficit is selective."}`;
  else clueLine = "Next time, try a few of the mental status questions under “Ask more questions”. A quick screen of orientation, memory, language and judgment shows how selective the deficit is.";
  clueLine = skipLine + " " + clueLine;
 }
 const xs = sc.filter(x=>x.s.tests).flatMap(x=>(x.a?.extra||[]));
 const xr = xs.map(k=>[k,reactExtra(c,k).lvl]);
 const xGood = xr.filter(([,l])=>l==="good"||l==="maybe"), xNo = xr.filter(([,l])=>l==="no");
 const xLine = !xs.length ? "" : `You also ordered ${xs.length} extra test${xs.length>1?"s":""}.${xGood.length?` ${TESTS[xGood[0][0]].n} was a sensible addition.`:""}${xNo.length?` ${TESTS[xNo[0][0]].n} wouldn't have helped here; keep the battery focused on the referral question.`:""}`;
 const hintLine = hints ? `You used ${hints} hint${hints>1?"s":""}, which is exactly what supervision is for.` : "";
 return `<div class="gradebox"><div class="verdictmark">${v}</div>
   <div class="mentor">${face("ellis")}<div class="bubble"><span class="who">DR. ELLIS · CASE REVIEW</span>
    <p>${open}</p>${did}${workList}${clueLine?`<p>${clueLine}</p>`:""}${xLine?`<p>${xLine}</p>`:""}${hintLine?`<p>${hintLine}</p>`:""}<p class="hint">Want the full reasoning? Open the step-by-step explanation below.</p></div></div></div>`;
}

 const iv = caseClues(c).iv; if(!iv) return ""; const a = asked(c.id); if(!a.length) return "";
 return `<details class="evidence"><summary>Evidence board · ${a.length} clue${a.length>1?"s":""} (tap to open)</summary>
  <div class="notes">${a.map((k,j)=>`<div class="note ${iv.qs[k].spared?"spared":""}" style="--r:${[-2,1.5,-1,2,-1.5,1][j%6]}deg">${iv.qs[k].clue}</div>`).join("")}</div></details>`;
}

function nextCaseId(){
 const ids = S.shift, i = ids.indexOf(CASES[cur.ci].id);
 for(let k=1;k<=ids.length;k++){ const c=CASES.find(x=>x.id===ids[(i+k)%ids.length]); if(!caseDone(c)) return c.id; }
 return "report";
}

function pill(sc,h){
 const tag = h?" · hint":"";
 if(sc>=0.99) return `<span class="score-pill good">Correct${tag}</span>`;
 if(sc>0) return `<span class="score-pill part">Partly correct${tag}</span>`;
 return `<span class="score-pill miss">Not quite${tag}</span>`;
}
function rankFor(p){
 if(p>=85) return ["Attending Neuropsychologist","You read patterns, not just scores."];
 if(p>=70) return ["Clinical Fellow","Strong reasoning with a few loose threads."];
 if(p>=50) return ["Resident Sleuth","Good instincts. Review the clinical pearls."];
 return ["Rookie Investigator","Every expert started here. Retry a case."];
}

 <div class="section-head"><h2>What would a neuropsychologist test next?</h2></div>
 <p class="prose" style="margin-bottom:16px">The same approaches come up across every case. These are the tools a neuropsychologist reaches for after the first round of testing.</p>
 <div class="approaches">
  <article class="approach"><h3>Hypothesis-driven batteries</h3><p>Choose tests that answer the referral question, then add tests to resolve what the first results leave open. The Boston Process Approach studies how a patient fails, not only whether they fail.</p><p class="ex">Contrast: fixed batteries like Halstead-Reitan</p></article>
  <article class="approach"><h3>Performance validity</h3><p>Stand-alone and embedded validity measures show whether scores reflect true ability, especially in forensic and compensation cases.</p><p class="ex">TOMM · Reliable Digit Span</p></article>
  <article class="approach"><h3>Premorbid estimation</h3><p>Impairment means decline from the person's own baseline. Estimate it from reading, education, work and demographics, using methods that fit the person's language.</p><p class="ex">TOPF · demographic formulas</p></article>
  <article class="approach"><h3>Assessing awareness</h3><p>When patients can't move or speak, standardized behavioral scales, EEG and fMRI imagery tasks can reveal covert awareness.</p><p class="ex">CRS-R · EEG · fMRI (Ch. 22)</p></article>
  <article class="approach"><h3>Lateralized and specialized tests</h3><p>Dichotic listening, lateralized visual presentation and the Wada test reveal what each hemisphere contributes.</p><p class="ex">Ch. 11 methods</p></article>
  <article class="approach"><h3>Ecological measures</h3><p>Standard tests supply structure real life doesn't. Real-world tasks and daily-living ratings show how deficits play out.</p><p class="ex">Multiple Errands Test · IADL scales</p></article>
  <article class="approach"><h3>Mood, personality, collateral</h3><p>Depression, anxiety, pain and sleep all affect cognition. Family interviews capture changes a test session can't.</p><p class="ex">BDI-II · PHQ-9 · collateral interview</p></article>
  <article class="approach"><h3>Integration with imaging</h3><p>MRI shows lesions; DTI shows white-matter integrity; fMRI and PET show activity. Neuropsychology shows function.</p><p class="ex">MRI · DTI · fMRI · PET</p></article>
  <article class="approach"><h3>Serial assessment</h3><p>Re-testing tracks recovery or decline. Alternate forms and reliable change indices separate real change from practice effects.</p><p class="ex">Baseline → 6–12 month follow-up</p></article>
 </div>

  <li>Wada, J., & Rasmussen, T. (1960). Intracarotid injection of sodium amytal for the lateralization of cerebral speech dominance. Journal of Neurosurgery, 17, 266–282.</li>
  <li>Weiskrantz, L., Warrington, E. K., Sanders, M. D., & Marshall, J. (1974). Visual capacity in the hemianopic field following a restricted occipital ablation. Brain, 97, 709–728.</li>
 </ul>
 <p class="disclaimer">All patients are fictional composites; portraits are illustrations. Scores are illustrative. This is an educational simulation and does not provide clinical advice.</p>`;
}

function render(){ renderNav(); if(cur.view==="landing") renderLanding(); else if(cur.view==="home") renderHome(); else if(cur.view==="case") renderCase(); else renderReport(); }
const repanel = () => { const p=$("#panel"); if(p) p.innerHTML = renderStep(); };

/* ======================= ROUTING ======================= */
function route(){
 const h = location.hash.replace("#",""); const ci = CASES.findIndex(c=>c.id===h);
 if(ci>=0){ if(cur.view!=="case"||cur.ci!==ci) cur={view:"case",ci,si:S.progress[CASES[ci].id]??0}; }
 else if(h==="report") cur={view:"report",ci:0,si:0};
 else if(h==="board") cur={view:"home",ci:0,si:0};
 else cur={view:"landing",ci:0,si:0};
 render(); window.scrollTo({top:0});
}
function go(t){ if(location.hash.replace("#","")===t) route(); else location.hash=t; }
window.addEventListener("hashchange", route);

/* ======================= EVENTS ======================= */
function step(delta){
 const c=CASES[cur.ci]; cur.si+=delta;
 if(delta<0) S.progress[c.id]=cur.si;
 if(c.steps[cur.si].type==="end" && delta>0){ freshStamp=true; if(!S.seen.includes(c.id)) S.seen.push(c.id); }
 renderCase(); renderNav(); window.scrollTo({top:0,behavior:"smooth"});
}
document.addEventListener("click", e=>{
 const t = e.target;
 const gEl = t.closest("[data-go]"); if(gEl){ go(gEl.dataset.go); return; }
 if(t.closest("#brand")){ if(location.hash) history.replaceState(null,"",location.pathname+location.search); route(); return; }
 if(t.closest("[data-toolkit]")){ openToolkit(); return; }
 const sc = t.closest("[data-scroll]"); if(sc){ document.getElementById(sc.dataset.scroll)?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
 if(t.closest("[data-closekit]") || t.id==="toolkit"){ closeToolkit(); return; }
 if(t.closest("#toolkit")) return;
 if(t.closest("#newshift")){ drawShift(); render(); const m=$("#shiftmsg"); if(m) m.textContent="New shift drawn. Five new patients are on the board."; return; }
 if(cur.view!=="case") return;
 const c=CASES[cur.ci], s=c.steps[cur.si];

 const rb = t.closest("[data-react]");
 if(rb){ S.reacts ??= {}; const r = (S.reacts[c.id] ??= []); const k=+rb.dataset.react; if(!r.includes(k)) r.push(k); save(); renderCase(); return; }
 if(t.closest("[data-moreq]")){ S.moreq ??= {}; S.moreq[c.id] = !S.moreq[c.id]; save(); renderCase(); return; }
 const askB = t.closest("[data-ask]");
 if(askB){ const k=+askB.dataset.ask, a=asked(c.id); if(!a.includes(k)){ a.push(k); freshClue=k; save(); renderCase(); } return; }
 const ib = t.closest("[data-info]");
 if(ib && s.type==="q"){ const a=ans(c.id,cur.si); a.inspect = +ib.dataset.info; a.inspectKey=null; a.guide=true; repanel(); return; }
 if(t.closest("[data-guide]") && s.tests){ const a=ans(c.id,cur.si); a.guide=!a.guide; repanel(); return; }
 const xt = t.closest("[data-xtest]");
 if(xt && s.tests){ const a=ans(c.id,cur.si); a.extra ??= []; if(!a.extra.includes(xt.dataset.xtest)) a.extra.push(xt.dataset.xtest); save(); repanel(); return; }
 const xi = t.closest("[data-xinfo]");
 if(xi && s.tests){ const a=ans(c.id,cur.si); a.inspectKey = xi.dataset.xinfo; a.guide=true; repanel(); document.querySelector(".tguide")?.scrollIntoView({behavior:"smooth",block:"center"}); return; }
 if(t.closest("[data-lm]") && s.map){ const a=ans(c.id,cur.si); a.lm = a.lm===false; repanel(); return; }
 const o = t.closest("[data-opt]");
 if(o && s.type==="q"){ const a=ans(c.id,cur.si); if(a.done) return; const k=+o.dataset.opt;
  a.sel = s.multi ? (a.sel.includes(k)?a.sel.filter(x=>x!==k):[...a.sel,k]) : (a.sel[0]===k ? [] : [k]);
  if(s.tests){ a.inspect = k; a.inspectKey = null; }
  if(s.map) focusOpt(a, s.options[k]);
  repanel(); return; }
 const hb = t.closest("[data-hemi]");
 if(hb && s.map){ ans(c.id,cur.si).hemi = hb.dataset.hemi; repanel(); return; }
 const vb = t.closest("[data-view]");
 if(vb && s.map){ ans(c.id,cur.si).view = vb.dataset.view; repanel(); return; }
 const reg = t.closest("[data-region]");
 if(reg && s.type==="q" && s.map){ const a=ans(c.id,cur.si); if(a.done) return; const r=reg.dataset.region, H=hemiFor(s,a), V=viewFor(s,a);
  const k = s.options.findIndex(op=>visRegs(op,H,V).some(x=>x.n===r));
  if(k>=0){ a.sel = s.multi ? (a.sel.includes(k)?a.sel.filter(x=>x!==k):[...a.sel,k]) : (a.sel[0]===k?[]:[k]); repanel(); } return; }
 if(t.closest("#clearsel") && s.type==="q"){ const a=ans(c.id,cur.si); if(!a.done){ a.sel=[]; repanel(); } return; }
 if(t.closest("#hintbtn")){ ans(c.id,cur.si).hint=true; save(); repanel(); return; }
 if(t.closest("#submit")){ const a=ans(c.id,cur.si); a.done=true; a.score=scoreQ(s,a.sel); if(s.map){ const okO=s.options.find(o=>o.ok); if(okO) focusOpt(a,okO); } save(); repanel(); renderNav(); return; }
 if(t.closest("#retry")){ delete S.answers[c.id]; delete S.asked[c.id]; S.progress[c.id]=0; cur.si=0; save(); renderCase(); renderNav(); window.scrollTo({top:0}); return; }
 if(t.closest("#next")){
  if(cur.si < c.steps.length-1) step(1);
  else go(nextCaseId());
  return; }
 if(t.closest("#back")){ if(cur.si>0) step(-1); else go("board"); }
});

document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#toolkit").hidden) closeToolkit(); });
document.addEventListener("input", e=>{ if(e.target.id==="tk-search") renderToolkit(e.target.value); });
route();
</script>

</body>
