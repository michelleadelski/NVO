<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive neuropsychology case game: interview patients, order tests, localize on a brain map, and get feedback.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>The Neuropsychology Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a detective's case board inside a clinic. Grid-paper desk -> corkboard of 5 pinned patient polaroids drawn from a 14-case pool -> manila case files (interview, evidence notes, test kit, brain map) -> graded case feedback -> shift report. */
:root{
  --desk:#E6EDEB; --grid:#D3DEDB; --surface:#FFFFFF; --sunk:#EDF2F1; --ink:#15212A; --muted:#556670; --line:#CBD7D5;
  --accent:#0B5E66; --accent-ink:#FFFFFF; --accent-soft:#D3EAE8;
  --manila:#F1E2BC; --manila-edge:#DCC896; --manila-ink:#3B321D;
  --cork:#C7A577; --cork-dot:#B38F60;
  --polaroid:#FBFAF6; --polaroid-ink:#2A2A2A;
  --sticky:#FFE57A; --sticky-ink:#3A3000;
  --pin:#D23A2C; --stamp:#C2362B;
  --imp:#B3401A; --imp-soft:#F8E1D7; --low:#946500; --low-soft:#F6ECCD; --ok:#2B7A4B; --ok-soft:#DCEFE2;
  --lobe-f:#CFE6E3; --lobe-p:#E3E0F0; --lobe-t:#F3E3CC; --lobe-o:#E2EDD3; --cereb:#E9D8DD; --brain-line:#7F9590; --hl:#0B8E96; --shade-hi:#FFFFFF; --shade-lo:#1E2B33;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-type:"Special Elite","Courier New",Courier,monospace;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0F1618; --grid:#182326; --surface:#162124; --sunk:#1C2A2D; --ink:#E4ECEB; --muted:#9AACB0; --line:#2B3B3F;
  --accent:#5CC3C6; --accent-ink:#06282B; --accent-soft:#143739;
  --manila:#3A321F; --manila-edge:#4E4429; --manila-ink:#F0E4C4;
  --cork:#3D3022; --cork-dot:#4A3B2A;
  --polaroid:#ECEAE3; --polaroid-ink:#222;
  --sticky:#E8CF5E; --sticky-ink:#2E2600;
  --pin:#EF5B4C; --stamp:#F0745F;
  --imp:#F0896A; --imp-soft:#3D2219; --low:#E2B54E; --low-soft:#352B12; --ok:#6FCB92; --ok-soft:#173022;
  --lobe-f:#1F3D3B; --lobe-p:#2D2A42; --lobe-t:#3E3222; --lobe-o:#2A3A20; --cereb:#3A2830; --brain-line:#7E9A96; --hl:#5CD3D9; --shade-hi:#CFE8E6; --shade-lo:#000000;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#0F1618; --grid:#182326; --surface:#162124; --sunk:#1C2A2D; --ink:#E4ECEB; --muted:#9AACB0; --line:#2B3B3F;
  --accent:#5CC3C6; --accent-ink:#06282B; --accent-soft:#143739;
  --manila:#3A321F; --manila-edge:#4E4429; --manila-ink:#F0E4C4;
  --cork:#3D3022; --cork-dot:#4A3B2A;
  --polaroid:#ECEAE3; --polaroid-ink:#222;
  --sticky:#E8CF5E; --sticky-ink:#2E2600;
  --pin:#EF5B4C; --stamp:#F0745F;
  --imp:#F0896A; --imp-soft:#3D2219; --low:#E2B54E; --low-soft:#352B12; --ok:#6FCB92; --ok-soft:#173022;
  --lobe-f:#1F3D3B; --lobe-p:#2D2A42; --lobe-t:#3E3222; --lobe-o:#2A3A20; --cereb:#3A2830; --brain-line:#7E9A96; --hl:#5CD3D9; --shade-hi:#CFE8E6; --shade-lo:#000000;
  color-scheme:dark }

*{box-sizing:border-box}
body{background-color:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-block:16px 72px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--f-type);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}
.lbl{font-family:var(--f-type);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

.btn{border:0;border-radius:8px;padding:11px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent)}
.btn.small{padding:7px 14px;font-size:14px}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:6px 6px 0 0;border-bottom-width:3px;padding:5px 12px;font-size:13px;cursor:pointer;font-family:var(--f-type)}
.chip-btn:hover{border-bottom-color:var(--accent)}
.chip-btn.on{border-bottom-color:var(--accent);color:var(--accent)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;display:block;line-height:1.1}
.brand small{font-family:var(--f-type);font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.navlinks{display:flex;gap:4px;flex-wrap:wrap}

.polaroid{position:relative;background:var(--polaroid);padding:8px 8px 6px;box-shadow:0 6px 14px rgba(0,0,0,.18);transform:rotate(var(--r,0deg));margin:0;width:var(--w,130px);flex:none}
.polaroid svg{display:block;width:100%;height:auto}
.polaroid figcaption{font-family:var(--f-hand);font-size:20px;line-height:1.1;color:var(--polaroid-ink);text-align:center;padding-top:4px}
.polaroid figcaption small{display:block;font-family:var(--f-body);font-size:11px;opacity:.7}
.pin{position:absolute;top:-7px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8 0 2px,var(--pin) 3px);box-shadow:0 2px 3px rgba(0,0,0,.35);z-index:2}
.face{width:44px;height:52px;flex:none;border-radius:6px;overflow:hidden;background:var(--sunk);display:block}
.face svg{display:block;width:100%;height:100%}

.mentor{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.mentor .face{width:52px;height:60px;border:2px solid var(--accent)}
.bubble{background:var(--accent-soft);border-radius:4px 14px 14px 14px;padding:12px 16px;display:grid;gap:8px}
.bubble .who{font-family:var(--f-type);font-size:12.5px;color:var(--accent);letter-spacing:.04em}

.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:36px;padding-block:36px 28px;align-items:start}
.hero h1{font-size:clamp(40px,6.4vw,70px);font-weight:800;letter-spacing:-.025em}
.hero .tag{font-family:var(--f-hand);font-size:clamp(24px,3vw,32px);color:var(--accent);margin-top:8px;line-height:1.2}
.hero .lede{font-size:18px;margin-top:16px;max-width:36em}
.folder{position:relative;background:var(--manila);color:var(--manila-ink);border-radius:2px 10px 10px 10px;padding:22px 22px 18px;box-shadow:0 8px 20px rgba(0,0,0,.12);margin-top:18px}
.folder::before{content:attr(data-tab);position:absolute;top:-22px;left:0;padding:3px 16px 0;height:22px;background:var(--manila);border-radius:8px 8px 0 0;font-family:var(--f-type);font-size:12px;letter-spacing:.06em}
.folder ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:7px;counter-reset:m}
.folder li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:baseline;counter-increment:m;font-size:15.5px}
.folder li::before{content:counter(m);font-family:var(--f-type);font-size:13px;border:1.5px solid currentColor;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px;padding-top:14px;border-top:1.5px dashed var(--manila-edge)}
.kit div{font-size:14px;line-height:1.35}
.kit b{display:block;font-family:var(--f-type);font-weight:400;font-size:13px;letter-spacing:.04em;text-transform:uppercase}

.stamp{display:inline-block;font-family:var(--f-type);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--stamp);border:3px double var(--stamp);padding:2px 10px;transform:rotate(-6deg);opacity:.9}
.stamp.ok{color:var(--ok);border-color:var(--ok)}
.stamp.big{font-size:30px;padding:4px 18px;border-width:5px;justify-self:start}
@keyframes thump{0%{transform:rotate(-6deg) scale(2.4);opacity:0}60%{transform:rotate(-6deg) scale(.92);opacity:1}100%{transform:rotate(-6deg) scale(1);opacity:.9}}
.stamp.anim{animation:thump .45s cubic-bezier(.2,.8,.3,1.2) both}

.board{position:relative;background-color:var(--cork);background-image:radial-gradient(var(--cork-dot) 1.2px,transparent 1.6px);background-size:9px 9px;
  border:10px solid color-mix(in srgb,var(--cork) 60%,#3b2a17);border-radius:6px;padding:34px 24px 28px;margin-top:10px}
.board-title{position:absolute;top:-22px;left:24px;background:var(--surface);border:2px solid var(--ink);padding:4px 14px;font-family:var(--f-type);font-size:14px;letter-spacing:.06em;transform:rotate(-1.5deg)}
.board-tools{display:flex;justify-content:flex-end;margin:-14px 0 16px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:30px 22px}
.casepin{position:relative;background:var(--polaroid);color:var(--polaroid-ink);border:0;padding:10px 10px 14px;cursor:pointer;text-align:left;transform:rotate(var(--r));box-shadow:0 8px 16px rgba(0,0,0,.25);transition:transform .18s ease;display:flex;flex-direction:column;gap:8px}
.casepin:hover{transform:rotate(0deg) translateY(-4px) scale(1.02)}
.casepin .photo{position:relative;display:block}
.casepin .photo svg{display:block;width:100%;height:auto}
.casepin .no{font-family:var(--f-type);font-size:12px;opacity:.75}
.casepin h3{font-family:var(--f-hand);font-weight:700;font-size:24px;line-height:1.05}
.casepin p{font-size:13.5px;line-height:1.4;opacity:.85}
.casepin .stamp{position:absolute;right:8px;top:44%;background:color-mix(in srgb,var(--polaroid) 70%,transparent);font-size:14px}
.casepin .grade{position:absolute;left:8px;top:8px;background:var(--sticky);color:var(--sticky-ink);font-family:var(--f-hand);font-weight:700;font-size:21px;padding:0 10px;transform:rotate(-4deg)}
.casepin.reportpin{background:var(--sticky);color:var(--sticky-ink);padding:24px 18px 18px;gap:14px;min-width:0}
.reportpin .rp-head{font-family:var(--f-type);font-size:11.5px;letter-spacing:.08em;border-bottom:1.5px dashed currentColor;padding-bottom:8px}
.reportpin h3{font-family:var(--f-type);font-weight:400;font-size:21px;line-height:1.2;letter-spacing:.01em;overflow-wrap:break-word}
.rp-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-family:var(--f-type);font-size:13.5px;line-height:1.35}
.rp-list li{display:grid;grid-template-columns:16px 1fr;gap:6px}
.rp-list li::before{content:"";width:11px;height:11px;border:1.5px solid currentColor;margin-top:3px}
.rp-cta{margin-top:auto;font-family:var(--f-type);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.disclaimer{margin-top:30px;font-size:13px;color:var(--muted);max-width:70ch}

.casehead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;padding-block:26px 18px}
.casehead h1{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.015em}
.casehead .meta{font-family:var(--f-type);font-size:13px;color:var(--muted);margin-bottom:4px}
.counter{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.clue-count{background:var(--sticky);color:var(--sticky-ink);font-family:var(--f-hand);font-size:20px;font-weight:700;padding:2px 12px;transform:rotate(2deg);box-shadow:0 2px 4px rgba(0,0,0,.15)}
.caselayout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:26px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);list-style:none;margin:0;padding:0;display:grid;gap:1px}
.rail li{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:center;font-size:14px;color:var(--muted);padding:5px 4px}
.rail .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);justify-self:center;background:var(--surface)}
.rail li.done .dot{background:var(--accent);border-color:var(--accent)}
.rail li.cur{color:var(--ink);font-weight:700}
.rail li.cur .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.panel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:26px clamp(16px,4vw,34px);min-width:0;box-shadow:0 10px 24px rgba(0,0,0,.07)}
.panel h2{font-size:25px}
.stack{display:grid;gap:18px}

.idgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border:1.5px solid var(--manila-edge);background:var(--manila);color:var(--manila-ink);border-radius:4px;overflow:hidden;margin:0}
.idgrid div{padding:9px 12px;border-right:1px dashed var(--manila-edge);border-bottom:1px dashed var(--manila-edge);margin:0 -1px -1px 0}
.idgrid dt{font-family:var(--f-type);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;opacity:.75}
.idgrid dd{margin:2px 0 0;font-weight:700}
.filetop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
.memo{font-family:var(--f-type);font-size:15.5px;line-height:1.55;background:var(--sunk);border-left:4px solid var(--stamp);padding:12px 16px}
.memo b{display:block;font-size:12px;letter-spacing:.08em;color:var(--stamp);font-weight:400}
.prose{max-width:68ch;display:grid;gap:12px}

.interview{display:grid;gap:16px}
.cast{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;padding-top:8px}
.log{display:grid;gap:12px;background:var(--sunk);border-radius:10px;padding:14px;min-height:90px}
.log .empty{color:var(--muted);font-size:14px;font-style:italic;align-self:center;text-align:center}
.say{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.say.you{grid-template-columns:minmax(0,1fr)}
.say.you .txt{justify-self:end;background:var(--accent);color:var(--accent-ink);border-radius:14px 4px 14px 14px;max-width:80%}
.say .txt{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 13px;max-width:62ch}
.say .txt b{display:block;font-family:var(--f-type);font-weight:400;font-size:12px;color:var(--muted)}
.asks{display:flex;flex-wrap:wrap;gap:8px}
.ask{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer;text-align:left;font-size:14.5px}
.ask .face{width:28px;height:28px;border-radius:50%}
.ask:hover{border-color:var(--accent)}
.ask[disabled]{opacity:.45;cursor:default;text-decoration:line-through}
.optional{display:inline-block;font-family:var(--f-type);font-size:11px;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);vertical-align:middle;margin-left:6px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.note{background:var(--sticky);color:var(--sticky-ink);font-family:var(--f-hand);font-size:20px;line-height:1.15;padding:12px 12px 14px;box-shadow:0 3px 6px rgba(0,0,0,.15);transform:rotate(var(--r,1deg))}
.note.new{animation:pop .35s ease both}
@keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(var(--r,1deg));opacity:1}}
details.evidence{border:1.5px dashed var(--manila-edge);border-radius:8px;background:color-mix(in srgb,var(--manila) 40%,var(--surface))}
details.evidence summary{cursor:pointer;padding:9px 14px;font-family:var(--f-type);font-size:14px;color:var(--manila-ink)}
details.evidence .notes{padding:6px 14px 16px}
details.evidence .note{font-size:17px}

.prompt{font-size:20px;font-weight:700;max-width:60ch;line-height:1.35}
.options{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;transition:border-color .12s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .box{width:22px;height:22px;border:2px solid var(--muted);display:grid;place-items:center;font-size:14px;font-weight:700;margin-top:1px}
.opt.radio .box{border-radius:50%}
.opt.multi .box{border-radius:5px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[disabled]{cursor:default}
.opt .why{display:block;font-size:14.5px;color:var(--muted);margin-top:5px}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.is-bad{border-color:var(--imp);background:var(--imp-soft)}
.opt.is-bad .box{background:var(--imp);border-color:var(--imp);color:var(--surface)}
.opt.is-missed{border-style:dashed;border-color:var(--ok)}
.verdict{font-family:var(--f-type);font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-left:8px}
.is-ok .verdict,.is-missed .verdict{color:var(--ok)} .is-bad .verdict{color:var(--imp)}
.qrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.score-pill{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.score-pill.good{background:var(--ok-soft);color:var(--ok)}
.score-pill.part{background:var(--low-soft);color:var(--low)}
.score-pill.miss{background:var(--imp-soft);color:var(--imp)}
.src{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.explain h3{font-size:18px}

.qgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.brainbox{background:var(--sunk);border-radius:10px;padding:10px 12px 12px;position:sticky;top:12px;display:grid;gap:8px}
.brainbox svg{display:block;width:100%;height:auto}
.brainbox .cap{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-type);font-size:12.5px;color:var(--muted);flex-wrap:wrap;align-items:center}
.hemi{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.hemi button{border:0;background:var(--surface);padding:4px 12px;font-family:var(--f-type);font-size:12px;cursor:pointer}
.hemi button.on{background:var(--accent);color:var(--accent-ink)}
.lobe{stroke:var(--brain-line);stroke-width:1.5}
.sulc{fill:none;stroke:var(--brain-line);stroke-width:1.2;opacity:.6}
.rg{fill:var(--hl);fill-opacity:.1;stroke:var(--hl);stroke-width:1.5;stroke-dasharray:4 3;cursor:pointer;transition:fill-opacity .15s}
.rg:hover{fill-opacity:.28}

 .land-hero{grid-template-columns:1fr;gap:24px;padding-block:24px 20px}

<script>
/* ======================= PORTRAITS ======================= */
function avatar(p){
  const h=p.hairColor, s=p.skin;
  let back="", front="";
  const fringe=`<path d="M33,58 C34,31 50,26 60,26 C72,26 87,32 87,58 C80,42 70,36 60,40 C50,36 40,43 33,58Z" fill="${h}"/>`;

    {t:"Left inferior frontal gyrus (Broca's area)", region:"broca", ok:false, why:"Would cause nonfluent speech."},
    {t:"Right posterior parietal cortex", region:"parietal", side:"R", ok:false, why:"Classically produces left neglect. His Rey copy was intact."},
    {t:"Left lateral temporal lobe only", region:"temporal", ok:false, why:"One-sided left damage affects verbal more than visual memory. Both are impaired."}
   ],
   explain:{title:"The medial temporal lobe and consolidation", body:["H.M.'s medial temporal lobes were removed on both sides in 1953 (Scoville & Milner, 1957). His IQ stayed intact but he could not form new declarative memories.","Milner showed material-specificity: left temporal lesions impair verbal memory, right temporal lesions impair nonverbal memory. R.T. fails both, which fits bilateral damage. Herpes encephalitis targets the medial temporal lobes."], src:[L_TEMP, "Scoville & Milner (1957); Milner (1970)"]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"Over three days R.T. gets steadily faster at mirror drawing, but each day insists he has never seen the task. What does this tell you?",
   hint:"Is all memory the same kind of memory?",
   options:[
    {t:"He is exaggerating his memory problem", ok:false, why:"This is the expected pattern in amnesia; H.M. showed it too."},
    {t:"Skill (procedural) learning relies on different systems than episodic memory", ok:true, why:"Correct. Skill learning depends on basal ganglia, cerebellum and motor cortex, which are intact."},
    {t:"His hippocampus is recovering", ok:false, why:"He'd remember the practice sessions too."},
    {t:"Mirror drawing isn't a valid test", ok:false, why:"It's valid; it measures a different kind of memory."}
   ],
   explain:{title:"Memory is not one system", body:["Milner (1965) showed H.M. improving at mirror drawing without recalling the training: strong evidence that explicit and implicit memory are separate.","For rehab, R.T. can learn routines through repetition."], src:[TEXT+", Ch. 15", "Milner (1965)"]}},
  {type:"end", label:"Case closed",
   dx:"Anterograde amnesia consistent with bilateral medial temporal lobe damage after herpes simplex encephalitis",
   next:["Confirm with MRI.","Memory notebook, fixed routines and errorless learning (uses spared procedural memory).","Explain to family that repeated questions are a symptom.","Re-assess in 12 months with alternate forms."],
   pearl:"What is spared tells you as much as what is impaired. Normal IQ, span and Rey copy are what make the memory failure interpretable.",
   refs:[L_TEMP, "Scoville & Milner (1957)"]}
  ]},
/* ============ 02 WERNICKE ============ */
{ id:"case-2", no:"NP-02", tag:"Language", cat:"language", patient:"md", r:2.5,
  title:"“I Can Hear You, But I Don't Understand You”",
  short:"Talks fluently and confidently, but his sentences don't make sense.",
  cw:["Ch. 15 Temporal Lobes lecture; Ch. 16 slides (Token Test)","Wernicke's vs. Broca's vs. conduction aphasia, Meyer's loop, ecological validity","Token Test, Boston Naming Test, repetition"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"Retired teacher, sudden change two weeks ago. Listen carefully to how he talks.",
   id:[["Patient","M.D."],["Age","67"],["Handedness","Right"],["Education","17 yrs"],["Job","Retired teacher"]],
   referral:"Sudden language change two weeks ago. Characterize the disorder and advise the family.",
   history:["M.D. has atrial fibrillation, which raises stroke risk. The neurologist noted he misses objects in the upper right of his visual field."]},
  {type:"interview", label:"Interview", cast:["md","ruth"],
   qs:[
    {who:"md", q:"How was your morning?", a:"Oh, very good! I went to the stambler and got the, the thing, the morning drinker, and it was all very fine and good.", clue:"Fluent, effortless, but empty speech", note:"(He went to the café for coffee.)"},
    {who:"md", q:"Could you point to the window, please?", a:"The window, yes, very good, we had one at the house before. Lovely.", clue:"Doesn't follow a simple command", note:"(He smiles but doesn't point.)"},
    {who:"md", q:"Repeat after me: ‘The cat sat on the mat.’", a:"The cat… sat on the… the mallow. The mat-ten.", clue:"Repetition breaks down"},
    {who:"ruth", q:"When did this start?", a:"At breakfast two weeks ago. Suddenly talking nonsense. No weakness at all.", clue:"Sudden onset, no weakness"},
    {who:"ruth", q:"Does he understand you at home?", a:"Perfectly! Well… when I point at the coffee pot and say ‘coffee?’ he always gets it.", clue:"Wife says he understands at home"}
   ]},
  {type:"q", label:"Domains", multi:true, cat:"language",
   prompt:"Which aspects of language look impaired? Select all that apply.",
   hint:"Separate how he talks (speed, effort, melody) from what he says and understands.",
   options:[
    {t:"Auditory comprehension", ok:true, why:"Yes. He can't follow a one-step command."},
    {t:"Word selection (paraphasias, invented words)", ok:true, why:"Yes. ‘Morning drinker’ is a semantic paraphasia; ‘stambler’ a neologism."},
    {t:"Speech fluency and articulation", ok:false, why:"Spared. That's what makes this a fluent aphasia."},
    {t:"Hearing", ok:false, why:"Likely spared; a hearing screen will confirm."},
    {t:"Awareness of his own errors", ok:true, why:"Yes. Poor awareness is common here and complicates therapy."}
   ],
   explain:{title:"Fluent is not the same as intact", body:["Aphasias are classified by fluency, comprehension, repetition and naming. M.D. is fluent, but comprehension is poor."], src:[L_TEMP]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests will characterize his language?",
   hint:"Pick tests he can attempt. Complicated verbal instructions won't work.",
   options:[
    {t:"Token Test", ok:true, why:"Yes. Commands of rising complexity with tokens; isolates comprehension."},
    {t:"Boston Naming Test", ok:true, why:"Yes. Shows word substitutions."},
    {t:"Sentence repetition", ok:true, why:"Yes. Separates Wernicke's from transcortical sensory aphasia."},
    {t:"Wisconsin Card Sorting Test", ok:false, why:"He can't understand the instructions; results would be uninterpretable."},
    {t:"Stroop Test", ok:false, why:"Requires reading; mixes language with executive control."}
   ],
   explain:{title:"Isolating comprehension", body:["The Token Test (De Renzi & Vignolo, 1962) is listed in your course as a measure of language comprehension. It needs almost no speech, so failure can't be blamed on output."], src:[L_FRONT+" (Token Test)"]}},
  {type:"results", label:"Results",
   rows:[
    ["Pure-tone audiometry","Peripheral hearing","Normal","avg","Rules out hearing loss"],
    ["Token Test","Auditory comprehension","11 / 36","imp","Fails two-element commands",0],
    ["Boston Naming Test","Confrontation naming","19 / 60","imp","Fork → “spoon”",1],
    ["Sentence repetition","Repetition","2 / 10","imp","Only short phrases",2],
    ["Rey Complex Figure: Copy","Nonverbal drawing","33 / 36","avg","Demonstrated, not explained"]
   ],
   scale:"Raw scores.",
   pattern:"Hearing and nonverbal drawing are normal; everything needing word meaning is impaired. Fluent output with failed comprehension, repetition and naming is the Wernicke's profile."},
  {type:"q", label:"Localize", multi:false, cat:"language", map:true,
   prompt:"Point to it on the brain map. Where is the lesion?",
   hint:"Comprehension of speech sounds lives near auditory cortex. Remember the upper-right visual field clue.",
   options:[
    {t:"Left posterior superior temporal gyrus (Wernicke's area)", region:"wernicke", ok:true, why:"Correct. Disrupts the link between sound and meaning."},
    {t:"Left inferior frontal gyrus (Broca's area)", region:"broca", ok:false, why:"His speech would be effortful."},
    {t:"Right superior temporal gyrus", region:"wernicke", side:"R", ok:false, why:"Right temporal damage affects prosody and music more than word comprehension."},
    {t:"Arcuate fasciculus only", region:"arcuate", ok:false, why:"Produces conduction aphasia with comprehension preserved."}
   ],
   explain:{title:"The left temporal lobe and comprehension", body:["Wernicke (1874) described fluent aphasia after posterior temporal lesions. Meyer's loop (upper-field optic radiations) runs through the temporal lobe, explaining the upper-right field cut.","Atrial fibrillation suggests an embolic stroke in the left middle cerebral artery."], src:[L_TEMP, "Wernicke (1874)"]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"Ruth says, “He understands perfectly at home.” How do you reconcile that with a Token Test score of 11/36?",
   hint:"What was she doing when he ‘understood’?",
   options:[
    {t:"She's in denial", ok:false, why:"Dismissing her observation throws away information."},
    {t:"At home he uses context, routine and gesture; the Token Test removes them", ok:true, why:"Correct. She pointed at the coffee pot: the gesture did the work."},
    {t:"He is faking on the test", ok:false, why:"Nothing supports this."},
    {t:"The test is too hard for his age", ok:false, why:"Scores use age norms; he fails the easiest items."}
   ],
   explain:{title:"Ecological validity", body:["A score shows what the brain can do with context removed. Integrate it with collateral reports and observation."], src:[L_ASSESS]}},
  {type:"end", label:"Case closed",
   dx:"Wernicke's (fluent) aphasia from a probable embolic stroke in the left posterior superior temporal gyrus",
   next:["Speech-language therapy.","Coach family: short sentences, gestures, yes/no checks.","Stroke prevention for atrial fibrillation.","Re-assess in 3 months."],
   pearl:"A fluent patient can have a severe language disorder. Comprehension must be tested directly.",
   refs:[L_TEMP, "De Renzi & Vignolo (1962)"]}
  ]},
/* ============ 03 EXECUTIVE ============ */
{ id:"case-3", no:"NP-03", tag:"Executive function", cat:"executive", patient:"jk", r:-1.5,
  title:"The Manager Who Can't Manage",
  short:"Smart, articulate, remembers everything. Fired after 20 years for disorganization.",
  cw:["Ch. 16 Frontal Lobes lecture","Dorsolateral vs. orbitofrontal syndromes, perseveration, knowing vs. doing, Phineas Gage","WCST, Stroop, Tower of London, verbal fluency"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"She passed a screening test at her doctor's office. Her husband says something is very wrong. Find out who's right.",
   id:[["Patient","J.K."],["Age","44"],["Handedness","Right"],["Education","18 yrs"],["Job","Project manager (dismissed)"]],
   referral:"Personality change and declining work performance over 2 years. Cognitive screening was normal (28/30). MRI pending.",
   history:["J.K. was a respected project manager for 20 years, then began missing deadlines and leaving projects unfinished. She was dismissed three months ago."]},
  {type:"interview", label:"Interview", cast:["jk","mark"],
   qs:[
    {who:"jk", q:"Why did you leave your job?", a:"Corporate politics. Honestly, I could do that job in my sleep.", clue:"Limited insight"},
    {who:"jk", q:"How would you plan a weekend trip?", a:"Book a place. Then… we go. Oh! I bought a boat last month. Have you ever sailed?", clue:"Can't plan; drifts off topic"},
    {who:"mark", q:"What's changed?", a:"She bought a $6,000 boat on a whim. Told a dirty joke at her aunt's funeral. That's not her.", clue:"Impulsive, socially disinhibited"},
    {who:"mark", q:"Anything else unusual?", a:"When her road was closed she sat in the car 40 minutes instead of going another way. And food doesn't taste like anything to her.", clue:"Rigid; lost smell/taste"},
    {who:"mark", q:"How does she handle tasks at home?", a:"She'll tell you exactly what she should do. Then she doesn't do it.", clue:"Knows what to do, doesn't do it"}
   ]},
  {type:"q", label:"Domains", multi:true, cat:"executive",
   prompt:"Which functions look impaired? Select all that apply.",
   hint:"Memory and vocabulary are fine. Look at organizing, adapting and holding back.",
   options:[
    {t:"Planning and organization", ok:true, why:"Yes."},
    {t:"Cognitive flexibility (set shifting)", ok:true, why:"Yes. The closed road."},
    {t:"Inhibitory control", ok:true, why:"Yes. The impulsive purchase."},
    {t:"Social behavior and personality", ok:true, why:"Yes. The funeral joke."},
    {t:"Language", ok:false, why:"Spared."},
    {t:"Episodic memory", ok:false, why:"Spared."}
   ],
   explain:{title:"Executive function", body:["Executive functions organize goal-directed behavior. They're hard to see in a structured office visit because the examiner supplies the structure, which is why she passed the screen."], src:[L_FRONT]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests address the referral question?",
   hint:"Four tests map onto shifting, inhibition, planning and generating.",
   options:[
    {t:"Wisconsin Card Sorting Test", ok:true, why:"Yes. Strategy shifting; frontal patients perseverate."},
    {t:"Stroop Test", ok:true, why:"Yes. Inhibiting the automatic reading response."},
    {t:"Tower of London", ok:true, why:"Yes. Planning."},
    {t:"Verbal fluency (FAS)", ok:true, why:"Yes. Generativity."},
    {t:"Token Test", ok:false, why:"Comprehension; doesn't answer the question."},
    {t:"Finger Tapping", ok:false, why:"Motor speed, not executive control."}
   ],
   explain:{title:"Matching tests to frontal functions", body:["Your Ch. 16 slides connect the WCST with strategy shifting, fluency tasks with generativity, and the Tower of London/Hanoi with planning."], src:[L_FRONT]}},
  {type:"results", label:"Results",
   rows:[
    ["WAIS-IV Full Scale IQ","General intellect","108","avg","Normal"],
    ["WMS Delayed Memory","Episodic memory","102","avg","Normal"],
    ["Wisconsin Card Sorting Test","Set shifting","1 of 6 categories; 52 persev. errors","imp","Said “it's not color anymore” while sorting by color",0],
    ["Stroop interference","Response inhibition","T 28","imp","Many uncorrected errors",1],
    ["Tower of London","Planning","Excess moves, 6 rule breaks","imp","No pre-planning",2],
    ["Verbal fluency (FAS)","Generativity","17 words / 3 min","imp","Repetitions",3],
    ["Finger Tapping","Motor speed","R 52 / L 48","avg","Normal",5]
   ],
   scale:"T scores: mean 50, SD 10.",
   pattern:"IQ, memory and motor speed are normal; every task requiring a self-generated strategy fails. Knowing the rule changed but not using it is a classic frontal sign."},
  {type:"q", label:"Localize", multi:false, cat:"executive", map:true,
   prompt:"Point to it on the brain map. Which region is most likely affected?",
   hint:"Executive failures plus personality change, and lost smell: the olfactory nerves run under one part of this lobe.",
   options:[
    {t:"Prefrontal cortex: dorsolateral and orbitofrontal", region:["dlpfc","ofc"], side:"B", ok:true, why:"Correct. Dorsolateral: planning, shifting, fluency. Orbitofrontal: social behavior, impulse control."},
    {t:"Medial temporal lobes", region:"mtl", side:"B", ok:false, why:"Her memory is normal."},
    {t:"Left posterior temporal cortex", region:"wernicke", ok:false, why:"Her language is normal."},
    {t:"Primary motor cortex", region:"motor", ok:false, why:"Finger tapping is normal."}
   ],
   explain:{title:"Two frontal syndromes in one patient", body:["Milner (1963) showed dorsolateral frontal patients perseverate on the WCST. Orbitofrontal damage changes personality, as in Phineas Gage (Harlow, 1868).","<b>MRI:</b> an olfactory groove meningioma pressing on both orbitofrontal surfaces."], src:[L_FRONT, "Milner (1963); Harlow (1868)"]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"A colleague says, “Her IQ is 108, so her cognition is fine.” Is that right?",
   hint:"Who sets the goal and rules on an IQ test? Who sets them in real life?",
   options:[
    {t:"Yes. IQ is the best summary of cognition", ok:false, why:"IQ tests miss exactly these abilities."},
    {t:"No. IQ tests supply the structure her frontal lobes can no longer supply", ok:true, why:"Correct."},
    {t:"No. Her IQ is probably invalid", ok:false, why:"Nothing suggests invalid effort."},
    {t:"Yes, unless memory is also impaired", ok:false, why:"Executive deficits are disabling on their own."}
   ],
   explain:{title:"Normal scores, abnormal life", body:["Shallice & Burgess (1991) built the Multiple Errands Test, done on a real street, because standard tests miss this. Her husband's account was more diagnostic than her screen."], src:[L_FRONT, "Shallice & Burgess (1991)"]}},
  {type:"end", label:"Case closed",
   dx:"Dysexecutive syndrome with orbitofrontal features from a bilateral olfactory groove meningioma",
   next:["Neurosurgical consult; today's testing is the baseline.","Re-assess after surgery.","Assess financial decision-making capacity.","External structure: checklists, alarms."],
   pearl:"A normal screening score doesn't rule out frontal dysfunction. Ask the people who see the patient every day.",
   refs:[L_FRONT, "Milner (1963)", "Shallice (1982)"]}
  ]},
/* ============ 04 TBI ============ */
{ id:"case-4", no:"NP-04", tag:"Mild TBI & imaging", cat:"reasoning", patient:"al", r:3,
  title:"Normal MRI, Abnormal Life",
  short:"Four months after a bike crash, a graduate student can't keep up. Her MRI is clean.",
  cw:["Neuropsychological Assessment lecture; Neuroimaging (Sept 22)","Diffuse axonal injury, structure vs. function, white-matter tracts","Trail Making, PASAT, TOMM, DTI"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"Everyone tells her the scans are normal. She doesn't feel normal. Find out what the scans can't show.",
   id:[["Patient","A.L."],["Age","29"],["Handedness","Left"],["Education","18 yrs"],["Job","PhD student"]],
   referral:"Cognitive complaints four months after a mild TBI. CT and MRI normal. Is there an impairment?",
   history:["Hit by an opening car door while cycling. Glasgow Coma Scale 15 in the ED. CT and a 3T MRI were read as normal."]},
  {type:"interview", label:"Interview", cast:["al","sam"],
   qs:[
    {who:"al", q:"What happened?", a:"A car door opened in front of me. I hit my head. They said I was out for less than a minute.", clue:"Brief loss of consciousness"},
    {who:"al", q:"What's hardest now?", a:"Reading. I read the same paragraph four times. If someone talks while I work, I lose everything.", clue:"Struggles with divided attention"},
    {who:"al", q:"How are you sleeping?", a:"Badly. Five hours. Headaches most days.", clue:"Poor sleep, headaches"},
    {who:"sam", q:"What have you noticed?", a:"She used to juggle three projects. Now she gets irritated if I talk while she's cooking.", clue:"Slower, irritable under load"},
    {who:"al", q:"Is there any legal claim?", a:"No. I just want to finish my thesis.", clue:"No litigation"}
   ]},
  {type:"q", label:"First call", multi:false, cat:"reasoning",
   prompt:"Does the normal MRI rule out a meaningful brain injury?",
   hint:"What size of damage can structural MRI actually see?",
   options:[
    {t:"Yes. Normal MRI means a normal brain", ok:false, why:"Structural MRI misses microscopic injury."},
    {t:"No. Imaging can miss diffuse microscopic injury; testing measures function directly", ok:true, why:"Correct. Rotational forces shear axons on a scale MRI can't see."},
    {t:"Only if CT was also normal", ok:false, why:"CT is less sensitive than MRI."}
   ],
   explain:{title:"Structure versus function", body:["Your assessment lecture: behavioral findings can reveal deficits when imaging is inconclusive, with mild head trauma as a key example."], src:[L_ASSESS]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests do you include?",
   hint:"Mild TBI hits speed and divided attention. One test checks whether scores can be trusted.",
   options:[
    {t:"Performance validity test (TOMM)", ok:true, why:"Yes. Standard in every TBI evaluation."},
    {t:"Trail Making Test A and B", ok:true, why:"Yes. Speed and switching."},
    {t:"PASAT", ok:true, why:"Yes. Sensitive to slowed processing."},
    {t:"WMS story recall with delay", ok:true, why:"Yes. Separates encoding problems from amnesia."},
    {t:"Token Test", ok:false, why:"Language is normal."},
    {t:"Finger Tapping", ok:false, why:"Low yield."}
   ],
   explain:{title:"Testing the right domains", body:["Mild TBI most often affects speed, attention and working memory, which depend on long white-matter tracts. A valid profile makes low scores credible."], src:[L_ASSESS]}},
  {type:"results", label:"Results",
   rows:[
    ["TOMM, Trial 2","Performance validity","50 / 50","avg","Valid",0],
    ["Trail Making A","Processing speed","42nd %ile","avg","Normal",1],
    ["Trail Making B","Speed + switching","8th %ile","imp","Slow, two errors",1],
    ["PASAT","Divided attention","Impaired at fast rates","imp","Breaks down with pace",2],
    ["WMS Logical Memory II","Delayed recall","SS 7; 88% retained","avg","Keeps what she learned",3]
   ],
   scale:"%ile = percentile.",
   pattern:"She learns less up front but keeps 88% of it: an attention/encoding problem, not amnesia. Performance fails when speed and switching combine."},
  {type:"q", label:"Localize", multi:false, cat:"reasoning", map:true,
   prompt:"Point to it on the brain map. Which explanation fits best?",
   hint:"Retention is normal, and the cause is spread out, not in one spot.",
   options:[
    {t:"Focal hippocampal damage", region:"mtl", side:"B", ok:false, why:"Delayed retention is normal."},
    {t:"Diffuse injury to long white-matter tracts", region:"wm", side:"B", ok:true, why:"Correct. Slow processing that worsens under load fits disrupted connections."},
    {t:"Left temporal stroke", region:"temporal", ok:false, why:"No focal signs; imaging would show it."},
    {t:"Nothing: she's exaggerating", ok:false, why:"She passed validity testing perfectly."}
   ],
   explain:{title:"Diffuse axonal injury", body:["In TBI the brain rotates inside the skull, stretching long axons in the corpus callosum, cingulum and frontal tracts. The result is slower communication between regions."], src:[L_IMG]}},
  {type:"q", label:"Imaging", multi:false, cat:"reasoning",
   prompt:"Which imaging method could detect what her structural MRI missed?",
   hint:"You need a method sensitive to the direction water moves along axons.",
   options:[
    {t:"Diffusion tensor imaging (DTI)", ok:true, why:"Correct. Damaged tracts show reduced fractional anisotropy."},
    {t:"Repeat CT", ok:false, why:"Less sensitive."},
    {t:"Skull X-ray", ok:false, why:"Only shows bone."},
    {t:"Nothing could show it", ok:false, why:"Diffusion imaging addresses this gap."}
   ],
   explain:{title:"Diffusion imaging", body:["Your neuroimaging class covered how diffusion imaging reveals white-matter abnormalities after TBI, and that different tracts relate differently to memory and attentional control. DTI is strongest at group level."], src:[L_IMG]}},
  {type:"end", label:"Case closed",
   dx:"Reduced processing speed and divided attention after mild TBI, with sleep and headache contributing",
   next:["Treat sleep, headaches and mood.","Graded return to study with accommodations.","Single-tasking strategies.","Re-assess in 6 months."],
   pearl:"A normal scan is not proof of normal function. Structure and function answer different questions.",
   refs:[L_ASSESS, L_IMG]}
  ]},
/* ============ 05 CONTEXT ============ */
{ id:"case-5", no:"NP-05", tag:"Clinical judgment", cat:"reasoning", patient:"sr", r:-2.5,
  title:"The Score Isn't the Story",
  short:"Low scores after a workplace fall. Look at who is taking the test.",
  cw:["Neuropsychological Assessment lecture","Premorbid ability, culture, language, mood, validity, scores vs. clinical judgment","Validity testing, appropriate norms, premorbid estimation"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"An insurer wants a yes-or-no answer. Another clinician already ran tests. Be careful with this one.",
   id:[["Patient","S.R."],["Age","58"],["Handedness","Right"],["Education","—"],["Job","Warehouse supervisor"]],
   referral:"Referred by an insurer after a workplace fall. Do the test results show brain injury?",
   history:["S.R. slipped on a loading dock eight months ago and hit his head. No loss of consciousness. Another clinician gave a brief English-language battery last month."]},
  {type:"results", label:"First scores",
   rows:[
    ["Boston Naming Test (English)","Naming","31 / 60","imp","More than 2 SD below the mean"],
    ["Verbal fluency (English)","Word generation","19 words","imp","Below 5th %ile"],
    ["WAIS-IV Vocabulary (English)","Word knowledge","SS 4","imp","Well below average"],
    ["MoCA","Cognitive screen","21 / 30","low","Below cutoff"]
   ],
   scale:"Compared with standard English-language norms.",
   pattern:"On paper this looks like impairment. Think about what you don't know yet."},
  {type:"q", label:"First call", multi:false, cat:"reasoning",
   prompt:"Can you conclude from these scores alone that the fall caused brain dysfunction?",
   hint:"A low score says a performance is unusual for the norm group. Does it say why?",
   options:[
    {t:"Yes. Several scores are more than 2 SD below the mean", ok:false, why:"That doesn't tell you why."},
    {t:"Yes. The pattern points to left temporal damage", ok:false, why:"Low naming has many causes."},
    {t:"No. Scores must be interpreted in light of who the person is", ok:true, why:"Correct."}
   ],
   explain:{title:"Scores need clinical judgment", body:["Your lecture: scores don't replace clinical judgment. Clinicians integrate culture, language, history, motivation, comorbidities and everyday functioning."], src:[L_ASSESS]}},
  {type:"interview", label:"Interview", cast:["sr","ana"],
   intro:"You arrange an interview with a Portuguese interpreter.",
   qs:[
    {who:"sr", q:"Where did you grow up?", a:"In a village near Viseu, in Portugal. I came here at 30.", clue:"Portuguese first language", via:true},
    {who:"sr", q:"How much schooling did you have?", a:"Six years. Then I worked my father's farm.", clue:"6 years of schooling", via:true},
    {who:"sr", q:"How have you been feeling?", a:"They moved me to a lower job. I sleep four hours. Nothing makes me happy.", clue:"Depressed mood (PHQ-9 = 18)", via:true},
    {who:"sr", q:"Do you take any medication?", a:"For my back. Oxycodone, twice a day.", clue:"Opioid medication", via:true},
    {who:"ana", q:"Anything I should know about the situation?", a:"His lawyer says the insurer's decision depends on this report.", clue:"Compensation claim pending"}
   ]},
  {type:"q", label:"Context", multi:true, cat:"reasoning",
   prompt:"Which of these could lower his scores without any brain injury? Select all that apply.",
   hint:"Only one option is already handled by how the tests are scored.",
   options:[
    {t:"English is his second language", ok:true, why:"Yes."},
    {t:"Six years of formal education", ok:true, why:"Yes. Norms from more educated samples make him look impaired."},
    {t:"Moderately severe depression", ok:true, why:"Yes."},
    {t:"Opioid medication and poor sleep", ok:true, why:"Yes."},
    {t:"The compensation claim", ok:true, why:"Yes, as a reason to measure validity."},
    {t:"He is 58 years old", ok:false, why:"Age-corrected norms already handle this."}
   ],
   explain:{title:"The assessment framework", body:["Your course lists premorbid ability, culture, language, development, psychological factors, validity and environmental context."], src:[L_ASSESS]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"What should the re-assessment include?",
   hint:"Fix each problem you found.",
   options:[
    {t:"Performance validity testing", ok:true, why:"Yes."},
    {t:"Testing in Portuguese with appropriate norms", ok:true, why:"Yes."},
    {t:"Premorbid estimate from work history and demographics", ok:true, why:"Yes."},
    {t:"Assessment of mood and pain", ok:true, why:"Yes."},
    {t:"Same English tests with a stricter cutoff", ok:false, why:"Doesn't fix a mismatched norm group."}
   ],

/* ============ 06 NEGLECT ============ */
{ id:"case-6", no:"NP-06", tag:"Spatial attention", cat:"perception", patient:"ew", r:2,
  title:"The Woman Who Eats Half Her Plate",
  short:"Three weeks after a stroke, she leaves the left side of everything untouched.",
  cw:["Ch. 14 Parietal Lobes","Contralateral neglect, extinction, anosognosia, right-hemisphere dominance for attention","Line bisection, cancellation, drawing/copying, double simultaneous stimulation"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"The nurses noticed something odd at mealtimes. Go see for yourself.",
   id:[["Patient","E.W."],["Age","71"],["Handedness","Right"],["Education","16 yrs"],["Job","Retired librarian"]],
   referral:"Right-hemisphere stroke 3 weeks ago. Staff say she ‘ignores’ her left side. Characterize the problem; advise on rehab and safety at discharge.",
   history:["E.W. had a right middle cerebral artery stroke. She has mild weakness of her left arm. Her language is normal."]},
  {type:"interview", label:"Interview", cast:["ew","daniel"],
   qs:[
    {who:"ew", q:"How's the hospital food?", a:"Fine, but they give such tiny portions. I always finish and I'm still hungry.", clue:"Eats only the right half of her plate", note:"(The left half of her tray is untouched.)"},
    {who:"ew", q:"Is anything wrong with your left arm?", a:"My left arm? No, it's fine. Why?", clue:"Unaware of left arm weakness", note:"(It's weak, and she hasn't moved it all morning.)"},
    {who:"daniel", q:"What have you noticed?", a:"She only does her makeup on the right side of her face. And she bumps into door frames on her left.", clue:"Ignores left of body and space"},
    {who:"ew", q:"Can you read this headline for me? (CITY COUNCIL APPROVES NEW PARK)", a:"‘Approves new park.’ Lovely.", clue:"Reads only the right half"}
   ]},
  {type:"q", label:"Domains", multi:true, cat:"perception",
   prompt:"Which functions look impaired? Select all that apply.",
   hint:"Is she failing to see the left, or failing to attend to it? What does her reply about her arm tell you?",
   options:[
    {t:"Attention to the left side of space and body", ok:true, why:"Yes. Plate, face, door frames, headline: contralateral neglect."},
    {t:"Awareness of her own deficits", ok:true, why:"Yes. Denying the weak arm is anosognosia, common with right parietal damage."},
    {t:"Basic vision: she must be blind on the left", ok:false, why:"Neglect is a disorder of attention, not sight. Fields can be full; she doesn't attend to what she sees. Fields still need testing, because hemianopia can co-occur."},
    {t:"Language", ok:false, why:"Spared. Her errors come from where she looks, not from reading or comprehension."},
    {t:"Memory", ok:false, why:"No evidence of a memory problem."}
   ],
   explain:{title:"Contralateral neglect", body:["Neglect is a failure to report, respond to or orient toward stimuli on the side opposite a lesion, not explained by sensory or motor loss. It often comes with anosognosia."], src:[T14]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests characterize her problem?",
   hint:"You want paper-and-pencil tests of space, and a test of what happens when both sides are stimulated at once.",
   options:[
    {t:"Line bisection", ok:true, why:"Yes. Neglect patients mark the ‘middle’ far to the right."},
    {t:"Cancellation test (e.g., Albert's lines)", ok:true, why:"Yes. She'll miss targets on the left (Albert, 1973)."},
    {t:"Drawing/copying (clock, flower)", ok:true, why:"Yes. Left details go missing."},
    {t:"Double simultaneous stimulation", ok:true, why:"Yes. Tests for extinction: she may detect a left stimulus alone but lose it when the right is also stimulated."},
    {t:"Wisconsin Card Sorting Test", ok:false, why:"Not targeted, and spatial layout would confound it."},
    {t:"Token Test", ok:false, why:"Comprehension is fine."}
   ],
   explain:{title:"Measuring neglect", body:["Bedside spatial tests are sensitive to neglect; double simultaneous stimulation reveals extinction, a milder form where a left stimulus is lost only under competition."], src:[T14, "Albert (1973)"]}},
  {type:"results", label:"Results",
   rows:[
    ["Line bisection","Spatial attention","22% right of center","imp","Consistent rightward error",0],
    ["Albert's line cancellation","Spatial attention","0/18 left · 18/18 right","imp","Left side ignored",1],
    ["Clock drawing","Spatial attention, planning","All numbers on right","imp","Left half empty",2],
    ["Double simultaneous stimulation","Extinction","Left lost on 9/10 bilateral trials","imp","Detects left alone",3],
    ["Visual fields (single targets)","Basic vision","Full","avg","Not blind on left"],
    ["Token Test","Comprehension","34 / 36","avg","Normal",5]
   ],
   scale:"Raw scores.",
   pattern:"She sees left stimuli presented alone, but loses them whenever the right side competes. Her fields are full. This is an attentional problem, not blindness."},
  {type:"q", label:"Localize", multi:false, cat:"perception", map:true,
   prompt:"Point to it on the brain map. Use the hemisphere switch if you need to.",
   hint:"The neglected side is opposite the lesion. Which hemisphere is dominant for spatial attention?",
   options:[
    {t:"Right posterior parietal cortex", region:"parietal", side:"R", ok:true, why:"Correct. Right parietal (often inferior parietal/temporoparietal) damage is the classic cause of left neglect."},
    {t:"Left posterior parietal cortex", region:"parietal", ok:false, why:"Left parietal damage can cause right neglect, but it's rarer and milder. Her neglect is on the left anyway."},
    {t:"Right primary visual cortex", region:"v1", side:"R", ok:false, why:"V1 damage causes hemianopia (true blindness). Her fields are full."},
    {t:"Left inferior frontal gyrus", region:"broca", ok:false, why:"Would affect speech, not space."}
   ],
   explain:{title:"Why left neglect is more common", body:["One influential account: the right hemisphere attends to both sides of space, while the left attends mainly to the right. Lose the right parietal lobe and nothing covers the left; lose the left and the right hemisphere still covers both sides."], src:[T14]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"Her son wants to take her home to live alone next week, since “her eyes test fine.” What's your main concern?",
   hint:"Combine two things: she ignores the left, and she doesn't know it.",
   options:[
    {t:"None. Full visual fields mean she's safe", ok:false, why:"Neglect isn't a field problem."},
    {t:"Neglect plus anosognosia makes daily life risky (stove, traffic, falls), because she won't compensate", ok:true, why:"Correct. Unlike a hemianopic patient, she doesn't know to turn her head."},
    {t:"She'll forget to take her medication", ok:false, why:"Memory is not the issue here."},
    {t:"She won't be able to talk on the phone", ok:false, why:"Language is fine."}
   ],
   explain:{title:"Awareness drives safety", body:["Deficit awareness determines whether a patient can compensate. Neglect with anosognosia predicts poorer functional recovery and higher safety risk."], src:[T14, L_ASSESS]}},
  {type:"end", label:"Case closed",
   dx:"Left hemispatial neglect with extinction and anosognosia after a right posterior parietal (MCA) stroke",
   next:["Rehab: visual scanning training, left-side anchoring cues, prism adaptation.","Home safety and occupational therapy assessment before living alone.","No driving.","Educate family about anosognosia."],
   pearl:"Seeing is not attending. Full visual fields don't mean both sides of space are processed.",
   refs:[T14, "Albert, M. L. (1973). A simple test of visual neglect."]}
  ]},
/* ============ 07 VISUAL AGNOSIA ============ */
{ id:"case-7", no:"NP-07", tag:"Object recognition", cat:"perception", patient:"ko", r:-2,
  title:"The Designer Who Can't Recognize a Cup",
  short:"She sees colors and edges clearly but can't tell what objects are. Until she touches them.",
  cw:["Ch. 13 Occipital Lobes","Apperceptive vs. associative agnosia, ventral (what) vs. dorsal (how) streams, patient D.F.","Copying, shape matching (Efron), tactile naming, posting task"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"A graphic designer who can no longer recognize things by sight. Her eyes check out fine. Something else is going on.",
   id:[["Patient","K.O."],["Age","34"],["Handedness","Right"],["Education","16 yrs"],["Job","Graphic designer"]],
   referral:"Unable to recognize objects visually since carbon monoxide poisoning 5 months ago. Eye exam normal. Explain the problem.",
   history:["K.O. was found unconscious after a faulty heater leaked carbon monoxide into her apartment. She recovered well physically."]},
  {type:"interview", label:"Interview", cast:["ko","jules"],
   qs:[
    {who:"ko", q:"(Holding up a mug) What is this?", a:"Something… round? Shiny on top. A lamp? (You hand it to her.) Oh! A coffee mug, obviously.", clue:"Can't identify by sight; can by touch"},
    {who:"ko", q:"Can you see me clearly?", a:"Totally. Colors, edges, it's all sharp. I just can't put it together into a thing.", clue:"Acuity and color intact"},
    {who:"jules", q:"How does she manage at home?", a:"She can't find anything in the fridge by looking. But she grabs door handles and cups perfectly, never fumbles.", clue:"Reaches and grasps accurately"},
    {who:"ko", q:"What do you call a tool for cutting paper?", a:"Scissors. Easy.", clue:"Naming from description is fine"}
   ]},
  {type:"q", label:"Domains", multi:true, cat:"perception",
   prompt:"Which functions look impaired? Select all that apply.",
   hint:"She can name things from touch and description, and her eyes work. What's left?",
   options:[
    {t:"Visual recognition of objects", ok:true, why:"Yes. Visual agnosia: failure to recognize objects by sight despite adequate vision."},
    {t:"Visual perception of form and shape", ok:true, why:"Yes. She sees edges but can't assemble them into a shape."},
    {t:"Language and naming", ok:false, why:"Spared. She names by touch and description."},
    {t:"Visually guided reaching and grasping", ok:false, why:"Spared. Remarkably, she grasps objects accurately."},
    {t:"Basic vision (acuity, color)", ok:false, why:"Spared."}
   ],
   explain:{title:"Visual agnosia", body:["Agnosia means ‘not knowing’: a recognition failure that can't be explained by low-level sensory loss, language or memory. Lissauer distinguished apperceptive agnosia (can't form a percept) from associative agnosia (percept formed, but not linked to meaning)."], src:[T13]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests pin down the type of agnosia?",
   hint:"Rule out low-level vision and language, then check whether she can even perceive shape.",
   options:[
    {t:"Copying line drawings", ok:true, why:"Yes. Apperceptive patients can't copy; associative patients copy well but still can't say what it is."},
    {t:"Shape matching (Efron shapes)", ok:true, why:"Yes. Discriminating squares from rectangles of equal area tests basic form perception."},
    {t:"Visual acuity and visual fields", ok:true, why:"Yes. Rule out low-level vision loss."},
    {t:"Tactile naming", ok:true, why:"Yes. Shows naming and knowledge are intact through another sense."},
    {t:"Wisconsin Card Sorting Test", ok:false, why:"Not targeted, and it's visual, so it would be confounded."},
    {t:"Finger Tapping", ok:false, why:"Not relevant."}
   ],
   explain:{title:"Testing the levels of vision", body:["Good agnosia testing goes level by level: sensation, form perception, recognition, naming. The copy test is the key split between apperceptive and associative agnosia."], src:[T13]}},
  {type:"results", label:"Results",
   rows:[
    ["Visual acuity","Low-level vision","20/25","avg","Normal",2],
    ["Efron shape matching","Form perception","Chance (52%)","imp","Can't tell square from rectangle",1],
    ["Copying line drawings","Form perception","Fragments only","imp","Couldn't copy an apple",0],
    ["Drawing from memory","Visual knowledge","Good apple","avg","Knowledge intact"],
    ["Visual naming","Recognition","4 / 20","imp","Guesses from color"],
    ["Tactile naming","Recognition by touch","20 / 20","avg","Normal",3],
    ["Posting card through slot","Visually guided action","Hand oriented correctly","avg","Accurate at all angles"]
   ],
   scale:"Raw scores.",
   pattern:"She can't perceive shape well enough to copy or match it, yet she draws from memory and names by touch. That's apperceptive agnosia. And her hand still orients correctly to a slot she can't describe."},
  {type:"q", label:"Localize", multi:false, cat:"perception", map:true,
   prompt:"Point to it on the brain map. Which system is damaged?",
   hint:"Two visual streams leave occipital cortex. One is for recognizing, one is for acting. Which one did she lose?",
   options:[
    {t:"Ventral stream (lateral occipital / occipitotemporal), both sides", region:"ventral", side:"B", ok:true, why:"Correct. The ventral ‘what’ stream builds object form. Carbon monoxide damaged lateral occipital cortex on both sides."},
    {t:"Dorsal stream (occipitoparietal)", region:"dorsal", side:"B", ok:false, why:"That's what's spared: it guides her reaching."},
    {t:"Primary visual cortex (V1)", region:"v1", side:"B", ok:false, why:"Bilateral V1 damage would cause cortical blindness. Her acuity is fine."},
    {t:"Wernicke's area", region:"wernicke", ok:false, why:"Language is normal."}
   ],
   explain:{title:"Two visual streams", body:["Goodale and Milner described patient D.F., who after carbon monoxide poisoning could not recognize shapes but could post a card through a slot at any angle. Ventral stream: vision for perception. Dorsal stream: vision for action."], src:[T13, "Goodale & Milner (1992)"]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"She can't say whether a slot is horizontal or vertical, but she posts a card through it perfectly. How?",
   hint:"Recognition and action don't need the same visual system.",
   options:[
    {t:"She's faking the recognition problem", ok:false, why:"Nothing suggests this; it's a well-documented dissociation."},
    {t:"The dorsal stream guides action without conscious perception of shape", ok:true, why:"Correct. Vision for action is separate from vision for perception."},
    {t:"She's using memory of where the slot was", ok:false, why:"The slot angle changes on every trial."},
    {t:"Lucky guessing", ok:false, why:"She's accurate at every angle."}
   ],
   explain:{title:"Perception vs. action", body:["This dissociation was key evidence for the two-streams model. It also has a practical upshot: she can learn to rely on touch and action while visual recognition is impaired."], src:[T13, "Milner & Goodale (1995)"]}},
  {type:"end", label:"Case closed",
   dx:"Apperceptive visual agnosia from bilateral ventral-stream damage after carbon monoxide poisoning",
   next:["Compensate with touch, color and texture cues; labeled, consistent home organization.","Occupational and vocational rehabilitation.","Re-assess in 6–12 months."],
   pearl:"Vision is not one system. Perceiving an object and acting on it rely on different cortical streams.",
   refs:[T13, "Goodale, M. A., & Milner, A. D. (1992). Separate visual pathways for perception and action."]}
  ]},

{ id:"case-8", no:"NP-08", tag:"Face recognition", cat:"perception", patient:"tn", r:1.5,
  title:"The Stranger at the Airport",
  short:"He walked right past his own wife. He recognizes her the moment she speaks.",
  cw:["Ch. 13 Occipital Lobes; Ch. 15 Temporal Lobes","Prosopagnosia, fusiform face area, covert recognition","Benton Facial Recognition, Cambridge Face Memory Test, famous faces"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"A teacher who can't recognize his students. He's embarrassed, so be gentle.",
   id:[["Patient","T.N."],["Age","48"],["Handedness","Right"],["Education","17 yrs"],["Job","High-school teacher"]],
   referral:"Difficulty recognizing people since a stroke one year ago. Characterize the deficit.",
   history:["T.N. had a right posterior cerebral artery stroke. The neurologist noted a small blind area in the upper left of his visual field."]},
  {type:"interview", label:"Interview", cast:["tn","carla"],
   qs:[
    {who:"tn", q:"How do you recognize your students?", a:"Voices. Backpacks. Haircuts are a disaster; one new haircut and I'm lost.", clue:"Uses voice and clothing to identify people"},
    {who:"carla", q:"When did you notice?", a:"He walked past me at the airport. Looked straight at me. I thought he was angry.", clue:"Didn't recognize his wife's face"},
    {who:"tn", q:"Any trouble with objects or reading?", a:"No. I read fine and can tell a Honda from a Toyota.", clue:"Objects and reading intact"},
    {who:"tn", q:"Can you tell if a face is happy or sad?", a:"Usually. And whether it's a man or woman, roughly how old. I just don't know who it is.", clue:"Expression, sex intact; identity lost"}
   ]},
  {type:"q", label:"Domains", multi:true, cat:"perception",
   prompt:"Which functions look impaired? Select all that apply.",
   hint:"He knows everything about his wife. What's broken is one route to that knowledge.",
   options:[
    {t:"Recognizing identity from faces", ok:true, why:"Yes. Prosopagnosia."},
    {t:"Object recognition", ok:false, why:"Spared, including fine distinctions like car models."},
    {t:"Knowledge about people", ok:false, why:"Spared. He recognizes people from their voices."},
    {t:"Reading facial expression", ok:false, why:"Largely spared, suggesting partly separate processing."},
    {t:"Reading", ok:false, why:"Spared."}
   ],
   explain:{title:"Prosopagnosia", body:["Prosopagnosia is a selective inability to recognize familiar faces. Recognition through voice, gait or context is preserved, showing that person knowledge itself is intact."], src:[T13]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests do you order?",
   hint:"Test face perception and face memory, and include a non-face control.",
   options:[
    {t:"Benton Facial Recognition Test", ok:true, why:"Yes. Matching unfamiliar faces tests face perception."},
    {t:"Famous faces test (with voice/name controls)", ok:true, why:"Yes. Compares recognition by face vs. by voice or name."},
    {t:"Cambridge Face Memory Test", ok:true, why:"Yes. Learning new faces."},
    {t:"Object recognition test", ok:true, why:"Yes. The control: is the deficit specific to faces?"},
    {t:"Token Test", ok:false, why:"Language is fine."},
    {t:"Tower of London", ok:false, why:"Not targeted."}
   ],
   explain:{title:"Proving specificity", body:["A deficit is only ‘face-specific’ if a comparably difficult non-face task is normal. That control is what makes the finding interpretable."], src:[T13, L_ASSESS]}},
  {type:"results", label:"Results",
   rows:[
    ["Famous faces","Face recognition","3 / 30","imp","Same people named from voice: 27/30",1],
    ["Cambridge Face Memory Test","Face learning","< 1st %ile","imp","Severely impaired",2],
    ["Benton Facial Recognition","Face perception","38","low","Borderline; slow, feature-by-feature",0],
    ["Object naming","Object recognition","58 / 60","avg","Normal",3],
    ["Visual fields","Low-level vision","Upper-left quadrant defect","low","Fits ventral right occipital lesion"],
    ["Skin conductance to faces","Covert recognition","Larger for familiar faces","avg","Body ‘recognizes’ them"]
   ],
   scale:"Raw scores and percentiles.",
   pattern:"Face recognition collapses while object recognition and voice recognition are normal. His skin conductance still rises for familiar faces he can't name."},
  {type:"q", label:"Localize", multi:false, cat:"perception", map:true,
   prompt:"Point to it on the brain map. Use the hemisphere switch.",
   hint:"Faces are processed along the underside of the occipital and temporal lobes, especially on one side.",
   options:[
    {t:"Right ventral occipitotemporal cortex (fusiform gyrus)", region:"ventral", side:"R", ok:true, why:"Correct. The right fusiform region is central to face identity; lesions there cause prosopagnosia."},
    {t:"Left ventral occipitotemporal cortex", region:"ventral", ok:false, why:"Left-sided lesions here more often affect reading (alexia). Face deficits are strongest with right or bilateral damage."},
    {t:"Medial temporal lobes", region:"mtl", side:"B", ok:false, why:"That would impair memory for everything, not just faces."},
    {t:"Right primary visual cortex", region:"v1", side:"R", ok:false, why:"Would cause a hemianopia, not a face-specific problem."}
   ],
   explain:{title:"Faces in the ventral stream", body:["Bodamer named prosopagnosia in 1947. Imaging later identified a face-selective region in the fusiform gyrus. The upper-left field defect fits: lesions below the calcarine fissure on the right affect the upper-left quadrant."], src:[T13, "Bodamer (1947)"]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"His skin conductance spikes for familiar faces he says he doesn't know. What does that mean?",
   hint:"Can the brain know something that the person isn't aware of?",
   options:[
    {t:"He's lying about not recognizing them", ok:false, why:"Covert recognition is well documented in genuine prosopagnosia."},
    {t:"Covert recognition: face information reaches some systems without reaching awareness", ok:true, why:"Correct. Recognition can be dissociated from conscious identification."},
    {t:"The test is broken", ok:false, why:"It's a reliable finding across studies."},
    {t:"He's recovering fully", ok:false, why:"Covert responses can persist without overt recovery."}
   ],
   explain:{title:"Covert recognition", body:["Tranel and Damasio (1985) showed autonomic responses to familiar faces in prosopagnosic patients. It's a reminder that ‘doesn't recognize’ can mean ‘can't access consciously’."], src:[T13, "Tranel & Damasio (1985)"]}},
  {type:"end", label:"Case closed",
   dx:"Acquired prosopagnosia after a right posterior cerebral artery stroke affecting the fusiform gyrus",
   next:["Compensatory cues: voices, name tags, seating charts.","Tell colleagues and students, to reduce social misunderstanding.","Screen mood and social anxiety."],
   pearl:"Recognition can be lost while knowledge is kept. He knows everything about his wife; he just can't reach it through her face.",
   refs:[T13, "Tranel & Damasio (1985)"]}
  ]},

    {t:"Medial temporal lobes", region:"mtl", side:"B", ok:false, why:"Memory is fine."}
   ],
   explain:{title:"The split brain", body:["Sperry's split-brain work (Nobel Prize, 1981) showed the left hemisphere usually controls speech, while the right excels at some spatial and face tasks."], src:[T11, "Sperry (1974); Gazzaniga (2005)"]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",

  {type:"intro", label:"Case file",

  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,

  {type:"q", label:"Localize", multi:false, cat:"perception", map:true,
   prompt:"Point to it on the brain map.",
   hint:"Where the parietal, temporal and occipital lobes meet, on the language-dominant side.",

  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"A colleague says these four symptoms prove there's a single ‘Gerstmann center’ in the brain. Agree?",
   hint:"Do these symptoms ever appear separately?",
