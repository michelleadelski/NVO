  title:"Seeing Without Knowing",
  short:"She swears she can't see anything on her left. She keeps pointing to it correctly.",
  cw:["Ch. 13 Occipital Lobes","Homonymous hemianopia, macular sparing, blindsight, hemianopia vs. neglect","Perimetry, forced-choice localization, line bisection, cancellation"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"Delivery driver with a visual problem after a stroke. Is it vision, or attention? The answer changes everything.",
   id:[["Patient","O.B."],["Age","55"],["Handedness","Right"],["Education","12 yrs"],["Job","Delivery driver"]],
   referral:"Visual loss on the left after a stroke 2 months ago. Distinguish field loss from neglect; advise on driving.",
   history:["O.B. had a right posterior cerebral artery stroke. No weakness."]},
  {type:"interview", label:"Interview", cast:["ob","ray"],
   qs:[
    {who:"ob", q:"What's the problem?", a:"Things on my left just aren't there. I clipped my left mirror twice. I know I have to turn my head.", clue:"Aware of left blind area; compensates"},
    {who:"ob", q:"(Wiggling fingers on her left) Do you see this?", a:"See what? Nothing.", clue:"Reports no vision on the left"},
    {who:"ob", q:"Just guess: is my hand up or down on your left?", a:"I'm only guessing… up?", clue:"Guesses correctly far above chance", note:"(She's right 9 out of 10 times.)"},
    {who:"ray", q:"Anything else?", a:"She reads fine and recognizes everyone. She just has to look around more.", clue:"Reading and recognition intact"}
   ]},
  {type:"q", label:"Domains", multi:true, cat:"perception",
   prompt:"What looks impaired? Select all that apply.",
   hint:"Compare her with the neglect patient: does she know about her problem?",
   options:[
    {t:"Conscious vision in the left visual field", ok:true, why:"Yes. Left homonymous hemianopia."},
    {t:"Awareness of her deficit", ok:false, why:"Spared. She knows and turns her head."},
    {t:"Attention to the left side", ok:false, why:"Spared. She actively searches left."},
    {t:"Object recognition", ok:false, why:"Spared."},
    {t:"Reading", ok:false, why:"Spared, though hemianopia can slow it."}
   ],
   explain:{title:"Hemianopia", body:["Homonymous hemianopia is loss of the same half of the visual field in both eyes after damage behind the optic chiasm, here the right primary visual cortex."], src:[T13]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests do you order?",
   hint:"Map the field loss, probe the ‘blind’ field, and check for neglect.",
   options:[
    {t:"Perimetry (formal visual fields)", ok:true, why:"Yes. Maps the field loss."},
    {t:"Forced-choice localization in the blind field", ok:true, why:"Yes. Tests for blindsight."},
    {t:"Line bisection", ok:true, why:"Yes. Hemianopic and neglect patients err in opposite directions."},
    {t:"Cancellation test", ok:true, why:"Yes. Neglect screen."},
    {t:"Wisconsin Card Sorting Test", ok:false, why:"Not targeted."},
    {t:"Token Test", ok:false, why:"Not targeted."}
   ],
   explain:{title:"Vision vs. attention", body:["Field testing plus neglect screening separates a sensory loss from an attentional one."], src:[T13, T14]}},
  {type:"results", label:"Results",
   rows:[
    ["Perimetry","Visual fields","Complete left hemianopia, macular sparing","imp","Both eyes",0],
    ["Forced-choice localization (blind field)","Residual vision","88% correct (chance 50%)","avg","Reports pure guessing",1],
    ["Line bisection","Spatial attention","Small leftward error","low","Toward the blind side; neglect errs right",2],
    ["Cancellation","Neglect screen","All targets found","avg","Uses head movements",3],
    ["Reading","Reading","Normal accuracy","avg","Slightly slow"]
   ],
   scale:"Raw scores.",
   pattern:"True field loss, no neglect, and above-chance performance in a field she experiences as blind."},
  {type:"q", label:"Localize", multi:false, cat:"perception", map:true,
   prompt:"Point to it on the brain map. Use the hemisphere switch.",
   hint:"Left visual field → opposite hemisphere → the back of the brain.",
   options:[
    {t:"Right primary visual cortex (V1)", region:"v1", side:"R", ok:true, why:"Correct. Right V1 damage causes left homonymous hemianopia."},
    {t:"Left primary visual cortex", region:"v1", ok:false, why:"Would cause right-field loss."},
    {t:"Right posterior parietal cortex", region:"parietal", side:"R", ok:false, why:"Would cause neglect; she has none."},
    {t:"Right ventral stream", region:"ventral", side:"R", ok:false, why:"Would affect recognition (e.g., faces), not the whole field."}
   ],
   explain:{title:"The visual field map", body:["Each visual field projects to the opposite occipital lobe. Macular sparing is common after posterior cerebral artery strokes."], src:[T13]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"How can she point to things she says she can't see?",
   hint:"V1 isn't the only route from the eye into the brain.",
   options:[
    {t:"She's lying about the field loss", ok:false, why:"Perimetry shows a genuine loss."},
    {t:"Blindsight: pathways that bypass V1 carry visual information without conscious awareness", ok:true, why:"Correct. Routes via the superior colliculus and pulvinar, and direct projections to extrastriate cortex."},
    {t:"V1 has fully recovered", ok:false, why:"Spared islands of V1 have been proposed in some cases, but full recovery doesn't fit a dense, stable field loss."},
    {t:"Lucky guessing", ok:false, why:"88% is far above chance."}
   ],
   explain:{title:"Blindsight", body:["Weiskrantz and colleagues (1974) described D.B., who could localize and discriminate stimuli in his blind field while denying seeing them. Visual processing and visual awareness can come apart."], src:[T13, "Weiskrantz et al. (1974)"]}},
  {type:"end", label:"Case closed",
   dx:"Left homonymous hemianopia with macular sparing and blindsight after a right occipital (PCA) stroke",
   next:["Driving assessment; most jurisdictions restrict driving with hemianopia.","Visual scanning training.","Reading strategies (line guides)."],
   pearl:"Hemianopia vs. neglect: one can't see and knows it; the other can see but doesn't attend, and often doesn't know.",
   refs:[T13, "Weiskrantz, L., et al. (1974). Visual capacity in the hemianopic field following a restricted occipital ablation."]}
  ]},
/* ============ 15 R.P. (Ch. 22 discussion case) ============ */
{ id:"case-15", no:"NP-15", tag:"Attention & recognition", cat:"attention", patient:"rp", r:-2,
  title:"Half a World, No Faces",
  short:"She ignores the left side of space, doesn't recognize her daughter, and can no longer draw a house.",
  cw:["Ch. 22 Attention & Consciousness (class discussion case R.P.)","Neglect vs. prosopagnosia vs. constructional apraxia; right-lateralized orienting network; representational neglect; prism adaptation","Line bisection, cancellation, famous faces, Rey copy, social judgment task"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"Four complaints, one patient. Your job is to work out which ones belong together.",
   id:[["Patient","R.P."],["Age","64"],["Handedness","Right"],["Education","16 yrs"],["Job","Retired architect"]],
   referral:"Gradual change over two years: bumping into things on the left, not recognizing family, poor judgment about people. Which systems are affected?",
   history:["A SPECT scan (regional blood flow) has been ordered. The cause of her decline is still being investigated."]},
  {type:"interview", label:"Interview", cast:["rp","mina"],
   qs:[
    {who:"rp", q:"Describe your kitchen as if you're standing in the doorway.", a:"The fridge, the window over the sink, the back door… that's about it.", clue:"Leaves out the left side of an imagined room", note:"(She names only things on the right side of the room.)"},
    {who:"rp", q:"What did you have for lunch?", a:"A tuna sandwich in the cafeteria.", clue:"Spared: memory for recent events", spared:true},
    {who:"mina", q:"What made you worried?", a:"Last month she looked right at me in the grocery store and asked if I worked there.", clue:"Didn't recognize her daughter's face"},
    {who:"rp", q:"Could you draw a simple house for me?", a:"(The walls don't meet and the roof floats beside the house.) Hmm. That's not right, is it?", clue:"Can't assemble a simple drawing"},
    {who:"mina", q:"How is her speech?", a:"Completely normal. She still corrects my grammar.", clue:"Spared: language", spared:true},
    {who:"mina", q:"Anything else that's changed?", a:"She gave her bank details to a man on the phone who said he was from the bank. She used to be so sharp about people.", clue:"Poor judgment about others' intentions"},
    {who:"rp", q:"Now picture the kitchen from the back door, looking in.", a:"From the back door… the stove, the pantry, the door to the hall.", clue:"Neglected half switches with viewpoint", note:"(Now she names the half she left out before.)"}
   ]},
  {type:"q", label:"Domains", multi:true, cat:"attention",
   prompt:"Which functions look impaired? Select all that apply.",
   hint:"There are four separate problems in the evidence. Two things look fine.",
   options:[
    {t:"Attention to the left side of space", ok:true, why:"Yes. Neglect, even of an imagined room."},
    {t:"Recognizing faces", ok:true, why:"Yes. Prosopagnosia: she didn't know her own daughter by sight."},
    {t:"Constructional ability (assembling a drawing)", ok:true, why:"Yes. Constructional apraxia."},
    {t:"Reading other people's intentions", ok:true, why:"Yes. Impaired social judgment."},
    {t:"Language", ok:false, why:"Her conversation is normal."},
    {t:"Basic vision", ok:false, why:"Nothing suggests an acuity or field problem; these are higher-level deficits."}
   ],
   explain:{title:"One patient, several systems", body:["R.P. has four problems: neglect, prosopagnosia, constructional apraxia and impaired social judgment. The skill is sorting which are attention problems and which reflect other systems."], src:[T22, L_22]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests do you order?",
   hint:"One test for each of the four problems.",
   options:[
    {t:"Line bisection and cancellation", ok:true, why:"Yes. Measures neglect."},
    {t:"Famous faces / Benton Facial Recognition", ok:true, why:"Yes. Measures face recognition."},
    {t:"Rey Complex Figure copy", ok:true, why:"Yes. Measures constructional ability."},
    {t:"Social judgment task (rating intentions and trustworthiness)", ok:true, why:"Yes. Measures social cognition."},
    {t:"Wisconsin Card Sorting Test", ok:false, why:"Not targeted."},
    {t:"Token Test", ok:false, why:"Language is fine."}
   ],
   explain:{title:"One test per hypothesis", body:["With several deficits, each needs its own measure so you can see whether they rise and fall together."], src:[L_ASSESS]}},
  {type:"results", label:"Results",
   rows:[
    ["Line bisection","Spatial attention","19% right of center","imp","Consistent rightward error",0],
    ["Star cancellation","Spatial attention","Missed 14 of 16 left targets","imp","Right side complete",0],
    ["Famous faces","Face recognition","4 / 30","imp","Names the same people from voice clips",1],
    ["Rey Complex Figure: Copy","Construction","14 / 36","imp","Parts scattered; left side missing",2],
    ["Social judgment task","Reading intentions","Rates untrustworthy faces as trustworthy","imp","Misses deceptive cues",3],
    ["Token Test","Comprehension","35 / 36","avg","Normal",5]
   ],
   scale:"Raw scores.",
   pattern:"Four impairments that don't all come from one place. Neglect and drawing problems are spatial; faces and intentions are about people."},
  {type:"q", label:"Localize", multi:false, cat:"attention", map:true,
   prompt:"Point to the damage that explains all four problems. Check both the outer and inner views.",
   hint:"You need a spatial (parietal) component and a face/social (right temporal) component.",
   options:[
    {t:"Superior parietal cortex on both sides, plus right temporal cortex (fusiform and STS)", region:["spl@B","posttemp@R","fusiform@R"], ok:true, why:"Correct. Parietal damage accounts for neglect and constructional apraxia; right temporal damage accounts for faces and social judgment."},
    {t:"Right temporoparietal junction only", region:"tpj", side:"R", ok:false, why:"Explains neglect, but not faces or social judgment."},
    {t:"Right fusiform gyrus only", region:"fusiform", side:"R", ok:false, why:"Explains prosopagnosia, but not neglect or drawing."},
    {t:"Dorsolateral prefrontal cortex, both sides", region:"dlpfc", side:"B", ok:false, why:"Might affect judgment, but not faces or left neglect."},
    {t:"Left angular gyrus", region:"angular", ok:false, why:"Would cause Gerstmann-type and language problems."},
    {t:"Hippocampus, both sides", region:"hippo", side:"B", ok:false, why:"Memory isn't her problem."}
   ],
   explain:{title:"What the SPECT showed", body:["Her SPECT showed low blood flow in the superior parietal cortex on both sides and in the right temporal lobe.","Parietal: the orienting network (neglect) and spatial assembly (constructional apraxia). Right temporal: face identity (fusiform) and reading intentions (STS, amygdala)."], src:[L_22, T22]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"When she imagines the kitchen from the back door, the neglected half switches. What does that tell you?",
   hint:"If the problem were in her eyes, would an imagined viewpoint matter?",
   options:[
    {t:"Her eyes are damaged on one side", ok:false, why:"She isn't looking at anything; she's imagining."},
    {t:"Neglect affects attention to a mental representation of space, not the eyes", ok:true, why:"Correct."},
    {t:"She's guessing", ok:false, why:"Her descriptions are accurate, just one-sided."},
    {t:"Her memory of the kitchen is faulty", ok:false, why:"She can describe both halves, just not from the same viewpoint."}
   ],
   explain:{title:"Neglect of imagined space", body:["Bisiach and Luzzatti (1978) asked neglect patients to imagine Milan's cathedral square from one end, then the other. The neglected half moved with the viewpoint. This is question 1 from your Chapter 22 discussion."], src:[L_22, "Bisiach & Luzzatti (1978)"]}},
  {type:"q", label:"Treatment", multi:false, cat:"attention",
   prompt:"Which Chapter 22 therapy might help her neglect?",
   hint:"It uses glasses and pointing practice.",
   options:[
    {t:"Prism adaptation: rightward-shifting prisms with pointing practice", ok:true, why:"Correct."},
    {t:"A memory notebook", ok:false, why:"Memory isn't the problem."},
    {t:"Speech therapy", ok:false, why:"Language is fine."},
    {t:"Nothing: neglect never improves", ok:false, why:"Neglect often improves, and prism adaptation can speed it."}
   ],
   explain:{title:"Prism adaptation", body:["Rossetti et al. (1998): prisms shifting vision 10° right, plus a few minutes of pointing, improved neglect at once, and the effect outlasted the session. Your slides cite 4–6 sessions giving benefits for up to about 4 weeks (Goedert et al., 2015)."], src:[L_22, "Rossetti et al. (1998)"]}},
  {type:"end", label:"Case closed",
   dx:"Left neglect, prosopagnosia, constructional apraxia and impaired social judgment, from bilateral superior parietal and right temporal hypoperfusion",
   next:["Prism adaptation sessions for neglect.","Face-recognition workarounds: voices, name cues.","Protect finances: trusted contact, call-back rules.","Continue the medical workup for the cause."],
   pearl:"One patient can have several deficits from different systems. Sort symptoms by system before you localize.",
   refs:[L_22, T22, "Rossetti et al. (1998)"]}
  ]},
/* ============ 16 COVERT AWARENESS ============ */
{ id:"case-16", no:"NP-16", tag:"Consciousness", cat:"attention", patient:"dv", r:2,
  title:"The Patient Who Answered with Tennis",
  short:"Six months after a brain injury he shows no response at the bedside. His brain scan tells a different story.",
  cw:["Ch. 22 Attention & Consciousness","Wakefulness vs. awareness, vegetative state, covert command-following (Owen), front vs. back theories, IIT","Coma Recovery Scale–Revised, fMRI mental imagery, EEG"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"An unusual consult. His family wants to know if he's still in there.",
   id:[["Patient","D.V."],["Age","23"],["Handedness","Right"],["Education","14 yrs"],["Job","Student"]],
   referral:"Six months after a severe traumatic brain injury, D.V. opens his eyes and has sleep-wake cycles but shows no consistent response to commands. Is there any evidence of awareness?",
   history:["D.V. was injured in a motorcycle crash. He breathes on his own. The team has documented no reliable command-following. He can't be interviewed, so you'll talk to his mother and his nurse."]},
  {type:"interview", label:"Interview", cast:["dv","grace","omar"],
   qs:[
    {who:"grace", q:"What do you notice when you visit?", a:"His eyes are open. Sometimes I think he looks at me, then it's gone.", clue:"Eyes open; possible but inconsistent tracking"},
    {who:"omar", q:"Does he follow any commands?", a:"We've tried hundreds of times. Squeeze my hand, blink twice. Nothing reliable.", clue:"No reliable command-following"},
    {who:"grace", q:"Does he react to loud noises?", a:"He startles if a tray drops.", clue:"Spared: startle reflex (brainstem)", spared:true},
    {who:"omar", q:"Does he have sleep-wake cycles?", a:"Clear ones. Eyes closed at night, open most of the day.", clue:"Sleep-wake cycles present"},
    {who:"omar", q:"Does he breathe on his own?", a:"Yes. He's been off the ventilator for months.", clue:"Spared: breathing (brainstem function)", spared:true},
    {who:"grace", q:"What was he like before?", a:"Funny. Obsessed with tennis; he played every weekend.", clue:"Loved tennis"}
   ]},
  {type:"q", label:"Bedside", multi:true, cat:"attention",
   prompt:"Which statements does the bedside evidence support? Select all that apply.",
   hint:"Separate being awake from being aware.",
   options:[
    {t:"He is awake: arousal and sleep-wake cycles are present", ok:true, why:"Yes."},
    {t:"There is no behavioral evidence of awareness", ok:true, why:"Yes, at the bedside."},
    {t:"Wakefulness and awareness can come apart", ok:true, why:"Yes. That's the definition of the vegetative state."},
    {t:"He is brain dead", ok:false, why:"He breathes and has sleep-wake cycles; brainstem function is present."},
    {t:"He is definitely unaware", ok:false, why:"No response doesn't prove no awareness; he may be unable to move."}
   ],
   explain:{title:"Wakefulness vs. awareness", body:["In the vegetative state (unresponsive wakefulness), arousal is present but there's no behavioral sign of awareness. Behavior can underestimate awareness if the patient can't move."], src:[T22]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Which assessments could detect awareness that behavior misses?",
   hint:"He can't speak or move on command. Which methods don't need that?",
   options:[
    {t:"Coma Recovery Scale–Revised, repeated", ok:true, why:"Yes. Standardized; repeated because responses fluctuate."},
    {t:"fMRI mental-imagery task", ok:true, why:"Yes. Detects command-following without movement."},
    {t:"EEG", ok:true, why:"Yes. Bedside, cheaper; can detect responses to commands."},
    {t:"Wisconsin Card Sorting Test", ok:false, why:"Needs a motor response."},
    {t:"Token Test", ok:false, why:"Needs a motor response."},
    {t:"Boston Naming Test", ok:false, why:"Needs speech."}
   ],
   explain:{title:"Looking past behavior", body:["When the motor system can't report, read brain activity directly. Your slides note simple measures like EEG may miss consciousness, so methods are combined."], src:[L_22, L_IMG]}},
  {type:"results", label:"Results",
   rows:[
    ["Coma Recovery Scale–Revised","Behavioral responsiveness","6 / 23","imp","Consistent with vegetative state",0],
    ["fMRI: imagine playing tennis","Command-following","Strong activation","avg","Matches healthy volunteers",1],
    ["fMRI: imagine walking through home","Command-following","Strong, different activation","avg","Matches healthy volunteers",1],
    ["fMRI yes/no questions","Communication","5 of 6 correct","avg","Tennis = yes, home = no",1],
    ["EEG","Brain activity","Sleep spindles; reacts to voice","avg","Preserved architecture",2]
   ],
   scale:"Raw scores.",
   pattern:"At the bedside he looks unaware. In the scanner he produced the requested brain patterns on command and used them to answer questions."},
  {type:"q", label:"Localize", multi:false, cat:"attention", map:true,
   prompt:"When told to imagine playing tennis, which region lit up? Use the medial view.",
   hint:"Imagining a movement engages motor planning areas near the top of the medial surface.",
   options:[
    {t:"Supplementary motor area", region:"sma", side:"B", ok:true, why:"Correct. Imagined tennis activates SMA, as in Owen et al. (2006)."},
    {t:"Parahippocampal cortex", region:"parahip", side:"B", ok:false, why:"That's the navigation task (walking through home)."},
    {t:"Calcarine cortex (V1)", region:"calc", side:"B", ok:false, why:"Wouldn't distinguish the two imagery tasks."},
    {t:"Amygdala", region:"amyg", side:"B", ok:false, why:"Not the marker for motor imagery."},
    {t:"Cerebellum", region:"cereb", side:"B", ok:false, why:"Holds most of the brain's neurons, yet removing it doesn't remove consciousness. Not the marker here."},
    {t:"Broca's area", region:"broca", ok:false, why:"He wasn't asked to speak."}
   ],
   explain:{title:"Answering with imagery", body:["Owen et al. (2006) asked a patient in a vegetative state to imagine tennis or walking through her home; her activation matched healthy volunteers. Monti et al. (2010) used the same contrast for yes/no answers."], src:[T22, "Owen et al. (2006); Monti et al. (2010)"]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"Does this prove D.V. is conscious?",
   hint:"What does the scan show, and what can't it show?",
   options:[
    {t:"Yes: he has full, normal experience", ok:false, why:"It shows covert command-following, not the richness of his experience."},
    {t:"No: it's just a reflex", ok:false, why:"Holding a mental task for 30 seconds on instruction isn't a reflex."},
    {t:"It's strong evidence of covert awareness, though not proof of full experience; a negative scan wouldn't prove unawareness", ok:true, why:"Correct."},
    {t:"It doesn't matter for his care", ok:false, why:"It matters for pain management, communication and family decisions."}
   ],
   explain:{title:"Unresponsive isn't unaware", body:["Your discussion talking point: not proof of experience, but bedside measures may miss consciousness. Integrated information theory allows consciousness to be graded after brain injury."], src:[L_22]}},
  {type:"q", label:"Theory", multi:false, cat:"attention",
   prompt:"Where in the brain is consciousness? Pick the answer that best fits Chapter 22.",
   hint:"The chapter presents this as an open debate.",
   options:[
    {t:"Settled: in the claustrum", ok:false, why:"Crick & Koch proposed it; there's little follow-up."},
    {t:"In the cerebellum, since it has the most neurons", ok:false, why:"Removing it doesn't remove consciousness."},
    {t:"Still debated: a frontoparietal network goes quiet in coma, sleep and anesthesia, while Boly et al. (2017) argue posterior parietal cortex is essential", ok:true, why:"Correct."},
    {t:"Only in the brainstem", ok:false, why:"The brainstem supports arousal, not the content of awareness."}
   ],
   explain:{title:"Front versus back", body:["In coma, vegetative state, sleep and anesthesia, dlPFC, medial frontal, posterior parietal and posterior cingulate are inactive. Boly, Tononi et al. (2017) argue posterior regions are essential and frontal cortex matters more for intelligence than awareness."], src:[L_22, "Boly et al. (2017)"]}},
  {type:"end", label:"Case closed",
   dx:"Vegetative state (unresponsive wakefulness) on bedside exam, with fMRI evidence of covert command-following",
   next:["Repeat behavioral and imaging assessments; responses fluctuate.","Assume he may feel pain: review pain management.","Try a yes/no communication channel with EEG or fMRI.","Support the family and revisit care decisions with this evidence."],
   pearl:"Unresponsive is not the same as unaware. Behavior is only one window into consciousness.",
   refs:[L_22, "Owen, A. M., et al. (2006). Detecting awareness in the vegetative state."]}
  ]},
/* ============ 17 BALINT ============ */
{ id:"case-17", no:"NP-17", tag:"Spatial attention", cat:"attention", patient:"bc", r:1.5,
  title:"One Thing at a Time",
  short:"His eyesight tests perfect, yet he can't find his wife in a room or reach for his coffee.",
  cw:["Ch. 14 Parietal Lobes; Ch. 22 Attention","Bálint's syndrome: simultanagnosia, optic ataxia, ocular apraxia; dorsal stream and the orienting network","Scene description, overlapping figures, reaching to peripheral targets, acuity and fields"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"Two eye doctors say his eyes are fine. He disagrees.",
   id:[["Patient","B.C."],["Age","58"],["Handedness","Right"],["Education","14 yrs"],["Job","Plumber"]],
   referral:"Visual difficulties since heart surgery 3 months ago. Eye exams normal. What's wrong?",
   history:["During bypass surgery B.C.'s blood pressure dropped sharply for several minutes."]},
  {type:"interview", label:"Interview", cast:["bc","irene"],
   qs:[
    {who:"bc", q:"Describe this picture for me. (A busy kitchen scene)", a:"A cookie jar. …That's it. Is there more?", clue:"Sees only one object at a time"},
    {who:"irene", q:"What's daily life like?", a:"He reaches for his coffee and his hand lands beside it. He knocks things over.", clue:"Misreaches for objects he can see"},
    {who:"bc", q:"What year did you get married?", a:"1991. June.", clue:"Spared: memory", spared:true},
    {who:"irene", q:"Anything else?", a:"At a party I waved at him from across the room. He stared straight ahead and couldn't find me.", clue:"Can't shift gaze to find things"},
    {who:"irene", q:"Does he recognize you by your face?", a:"Instantly, once he finds me.", clue:"Spared: face recognition", spared:true},
    {who:"bc", q:"Can you read this sentence?", a:"'The… dog.' I keep losing my place. One word at a time is fine.", clue:"Single words fine; loses place in text"}
   ]},
  {type:"q", label:"Domains", multi:true, cat:"attention",
   prompt:"Which functions look impaired? Select all that apply.",
   hint:"He named the cookie jar instantly. What can't he do with it?",
   options:[
    {t:"Seeing more than one object at a time", ok:true, why:"Yes. Simultanagnosia."},
    {t:"Visually guided reaching", ok:true, why:"Yes. Optic ataxia."},
    {t:"Voluntarily shifting gaze to a target", ok:true, why:"Yes. Ocular (oculomotor) apraxia."},
    {t:"Recognizing a single object", ok:false, why:"Spared."},
    {t:"Visual acuity", ok:false, why:"Normal on exam."},
    {t:"Language", ok:false, why:"Spared."}
   ],
   explain:{title:"Bálint's syndrome", body:["Bálint (1909) described the triad: simultanagnosia, optic ataxia and ocular apraxia. Single objects are recognized normally; the problem is attending to and acting on more than one location."], src:[T14, T22]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests do you order?",
   hint:"Rule out the eyes, then measure how many things he can attend to and how well he reaches.",
   options:[
    {t:"Complex scene description", ok:true, why:"Yes."},
    {t:"Overlapping figures test", ok:true, why:"Yes. He'll see one figure and lose the others."},
    {t:"Reaching to targets in peripheral vision", ok:true, why:"Yes. Measures optic ataxia."},
    {t:"Visual acuity and fields", ok:true, why:"Yes. Rules out a sensory explanation."},
    {t:"Token Test", ok:false, why:"Language is fine."},
    {t:"Wisconsin Card Sorting Test", ok:false, why:"A multi-card visual array would be confounded by his attention problem."}
   ],
   explain:{title:"Separating seeing from attending", body:["Acuity and fields rule out the eyes. Scene and overlapping-figure tests measure how many objects he can attend to at once; reaching tests measure visuomotor guidance."], src:[T14]}},
  {type:"results", label:"Results",
   rows:[
    ["Scene description","Simultaneous perception","1 of 12 items","imp","Names one object, then stops",0],
    ["Overlapping figures","Simultaneous perception","1 of 4 shapes","imp","Each named correctly when shown alone",1],

  {type:"q", label:"Localize", multi:false, cat:"attention", map:true,
   prompt:"Point to the damage on the brain map.",
   hint:"Both hemispheres, upper back part of the brain: the 'where/how' stream.",
   options:[
    {t:"Superior parietal and parieto-occipital cortex, both hemispheres (dorsal stream)", region:["spl","dorsal"], side:"B", ok:true, why:"Correct. Bilateral dorsal-stream damage, typically in arterial border zones after a blood-pressure drop, causes Bálint's syndrome."},
    {t:"Right superior parietal lobule only", region:"spl", side:"R", ok:false, why:"One-sided damage gives milder, one-sided problems (optic ataxia in one field, or neglect), not the full triad."},
    {t:"Lateral occipital cortex, both sides (ventral stream)", region:"lo", side:"B", ok:false, why:"That causes visual agnosia: he'd fail to recognize even a single object."},
    {t:"Occipital poles (V1), both sides", region:"v1", side:"B", ok:false, why:"Would cause cortical blindness; his acuity is 20/20."},
    {t:"Frontal eye fields, both sides", region:"fef", side:"B", ok:false, why:"Contribute to voluntary gaze, but don't explain optic ataxia or simultanagnosia."},
    {t:"Hippocampus, both sides", region:"hippo", side:"B", ok:false, why:"Memory isn't the problem."}
   ],
   explain:{title:"The dorsal stream and spatial attention", body:["The superior parietal lobule and intraparietal sulcus belong to the dorsal orienting network (frontal eye fields + intraparietal sulcus) in Chapter 22. Bilateral damage shrinks the attended world to one object."], src:[T14, L_22]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"His family says he's 'gone blind.' How do you explain that with 20/20 acuity?",
   hint:"Think of the gorilla in the basketball video.",
   options:[
    {t:"The eye exam was wrong", ok:false, why:"Two exams agree."},
    {t:"He sees normally, but can attend to only one object at a time, so everything else is effectively invisible", ok:true, why:"Correct."},
    {t:"He's exaggerating", ok:false, why:"His errors form a classic, consistent pattern."},
    {t:"He has visual agnosia", ok:false, why:"He recognizes single objects instantly."}
   ],
   explain:{title:"Attention limits awareness", body:["Chapter 22 treats attention as a filter on what reaches awareness. In Bálint's syndrome the filter collapses to one object, a permanent version of the inattentional blindness in Simons & Chabris's gorilla study."], src:[L_22, "Simons & Chabris (1999)"]}},
  {type:"end", label:"Case closed",
   dx:"Bálint's syndrome after bilateral parieto-occipital (border-zone) strokes",
   next:["Reduce clutter; present one item at a time.","Train reaching with touch and sound cues.","Reading aids: line windows, large print.","No driving."],
   pearl:"Normal eyes don't guarantee normal seeing. Attention decides how much of the visual world reaches awareness.",
   refs:[T14, L_22, "Bálint (1909)"]}
  ]},
/* ============ 18 PURE ALEXIA ============ */
{ id:"case-18", no:"NP-18", tag:"Disconnection", cat:"lateral", patient:"ws", r:-2,
  title:"He Can Write It, But He Can't Read It",
  short:"A retired journalist writes a perfect note, then can't read a word of it back.",
  cw:["Ch. 17 Disconnection Syndromes","Alexia without agraphia (Dejerine), splenium, right hemianopia, letter-by-letter reading","Word reading by length, writing to dictation, visual fields, object and color naming"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"A man who wrote for a living can't read his own handwriting. Work out how that's possible.",
   id:[["Patient","W.S."],["Age","70"],["Handedness","Right"],["Education","18 yrs"],["Job","Retired journalist"]],
   referral:"Sudden reading loss after a stroke one month ago. Writing is reportedly normal. Explain the dissociation.",
   history:["W.S. had a left posterior cerebral artery stroke. Speech and comprehension are normal."]},
  {type:"interview", label:"Interview", cast:["ws","dot"],
   qs:[
    {who:"ws", q:"Could you write a sentence for me?", a:"(Writes neatly: 'It is raining in Toronto today.')", clue:"Writes fluently and correctly"},
    {who:"ws", q:"Tell me about the last big story you covered.", a:"The 2009 transit strike. Six weeks on it.", clue:"Spared: memory and spoken language", spared:true},
    {who:"ws", q:"Now read it back to me.", a:"…I-T. It. I-S. Is… This is maddening. I just wrote it.", clue:"Can't read his own writing; spells letter by letter"},
    {who:"dot", q:"How does he manage at home?", a:"He traces letters on his palm with his finger to read signs. That works better.", clue:"Reads better by tracing letters"},
    {who:"dot", q:"Does he recognize people and find his way around?", a:"No trouble at all.", clue:"Spared: recognition and navigation", spared:true},
    {who:"ws", q:"Any trouble seeing?", a:"Things on my right surprise me. I turn my head a lot.", clue:"Possible right visual field loss"}
   ]},
  {type:"q", label:"Domains", multi:true, cat:"language",
   prompt:"Which functions look impaired? Select all that apply.",
   hint:"Writing and talking are fine. What isn't?",
   options:[
    {t:"Reading", ok:true, why:"Yes."},
    {t:"Vision in the right visual field", ok:true, why:"Yes. His complaints suggest a right hemianopia."},
    {t:"Writing", ok:false, why:"Spared."},
    {t:"Spoken language", ok:false, why:"Spared."},
    {t:"Object recognition", ok:false, why:"No evidence of a problem."}
   ],
   explain:{title:"Pure alexia", body:["Alexia without agraphia ('pure alexia') is loss of reading with writing preserved. Dejerine described it in 1892."], src:[T17]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests do you order?",
   hint:"Show how he reads, confirm writing, check the fields, and check naming.",
   options:[
    {t:"Reading words of different lengths", ok:true, why:"Yes. A word-length effect reveals letter-by-letter reading."},
    {t:"Writing to dictation and copying", ok:true, why:"Yes."},
    {t:"Visual fields", ok:true, why:"Yes."},
    {t:"Object and color naming", ok:true, why:"Yes. Color naming is often impaired in this syndrome; object naming usually isn't."},
    {t:"Wisconsin Card Sorting Test", ok:false, why:"Not targeted."},
    {t:"Rey delayed recall", ok:false, why:"Not targeted."}
   ],
   explain:{title:"Characterizing a reading disorder", body:["Word length, writing, fields and naming together distinguish pure alexia from aphasia and from alexia with agraphia."], src:[T17]}},
  {type:"results", label:"Results",
   rows:[
    ["Reading 3-letter words","Reading speed","2.1 s per word","low","Slow",0],
    ["Reading 9-letter words","Reading speed","12.8 s per word","imp","Letter by letter",0],
    ["Writing to dictation","Writing","Normal","avg","Fluent, accurate",1],
    ["Reading own writing (5 min later)","Reading","Failed","imp","Spells it out slowly",1],
    ["Visual fields","Vision","Right homonymous hemianopia","imp","Left field intact",2],
    ["Object naming","Naming","29 / 30","avg","Normal",3],
    ["Color naming","Naming","12 / 20","low","Matches colors fine",3]
   ],
   scale:"Raw scores.",
   pattern:"Reading time grows with every added letter; writing is perfect; the right field is gone. The language areas work. Visual words can't reach them."},
  {type:"q", label:"Localize", multi:false, cat:"lateral", map:true,
   prompt:"Point to the damage. You'll need the medial view.",
   hint:"Two parts: something that removes the right visual field, and something that blocks the other hemisphere's view from crossing over.",
   options:[
    {t:"Left calcarine cortex (V1) plus the splenium of the corpus callosum", region:["calc@L","splenium@B"], ok:true, why:"Correct. Left V1 damage removes the right field; the splenium lesion stops what the right hemisphere sees from reaching left-hemisphere language areas."},
    {t:"Left angular gyrus", region:"angular", ok:false, why:"Causes alexia WITH agraphia: writing would fail too."},
    {t:"Right calcarine cortex (V1)", region:"calc", side:"R", ok:false, why:"Removes the left field. With left-hemisphere vision intact, he'd read."},
    {t:"Wernicke's area", region:"wernicke", ok:false, why:"Would impair spoken comprehension."},
    {t:"Broca's area", region:"broca", ok:false, why:"Would impair speech and writing."},
    {t:"Entire corpus callosum", region:"cc", side:"B", ok:false, why:"Split-brain patients read normally in the right field. Callosal damage alone doesn't cause pure alexia."}
   ],
   explain:{title:"A disconnection, not a destruction", body:["Writing and speech use the intact left-hemisphere language network. Reading needs visual words to reach it. Left V1 is gone, so words are seen only by the right hemisphere, and the damaged splenium stops them crossing."], src:[T17, "Dejerine (1892); Geschwind (1965)"]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"Why does tracing letters with his finger help him read?",
   hint:"Find a route into the language system that isn't visual.",
   options:[
    {t:"Tracing sends the word through intact touch and movement pathways into the left-hemisphere language system, bypassing the visual disconnection", ok:true, why:"Correct."},
    {t:"It slows him down so his eyes can focus", ok:false, why:"His eyes aren't the issue."},
    {t:"It activates right-hemisphere language areas", ok:false, why:"The right hemisphere has limited reading ability; the benefit comes from reaching the left."},
    {t:"It's a placebo effect", ok:false, why:"The benefit is consistent and predictable from anatomy."}
   ],
   explain:{title:"Using another route in", body:["Disconnection syndromes can often be bypassed by sending information through a different intact pathway, which is why Chapter 17 treats them separately from damage to processing regions."], src:[T17]}},
  {type:"end", label:"Case closed",
   dx:"Alexia without agraphia with right hemianopia after a left posterior cerebral artery stroke (left occipital cortex and splenium)",
   next:["Reading therapy: repeated oral re-reading, tracing strategies.","Text-to-speech and audiobooks.","Visual scanning training for the right-field loss."],
   pearl:"Some syndromes come from cut connections, not damaged centers. Ask where the information has to travel.",
   refs:[T17, "Dejerine (1892)", "Geschwind (1965)"]}
  ]},
/* ============ 19 KORSAKOFF ============ */
{ id:"case-19", no:"NP-19", tag:"Memory", cat:"memory", patient:"gh", r:2.5,
  title:"The Stories That Never Happened",
  short:"He tells vivid stories about yesterday. None of them happened.",
  cw:["Ch. 18 Learning & Memory","Korsakoff syndrome, diencephalic amnesia, confabulation, temporally graded retrograde amnesia, proactive interference","WMS, famous-events test, WCST and fluency, release from proactive interference"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"His sister thinks he's lying. Find out what's really going on.",
   id:[["Patient","G.H."],["Age","55"],["Handedness","Right"],["Education","12 yrs"],["Job","Former welder"]],
   referral:"Memory problems after a hospitalization a year ago. Long history of heavy alcohol use. Characterize the memory disorder.",
   history:["A year ago G.H. was admitted confused, unsteady on his feet, with abnormal eye movements. He was treated with thiamine (vitamin B1)."]},
  {type:"interview", label:"Interview", cast:["gh","paula"],
   qs:[
    {who:"gh", q:"What did you do yesterday?", a:"Went to the track with my brother Eddie. Won forty bucks on a horse called Lightning.", clue:"Detailed, confident account of yesterday", note:"(Paula shakes her head: Eddie died in 2004, and G.H. has been on the ward all week.)"},
    {who:"gh", q:"Can you name these objects?", a:"Wrench, pliers, a… spirit level.", clue:"Spared: naming", spared:true},
    {who:"gh", q:"What year is it?", a:"1998? '99?", clue:"Disoriented in time; stuck decades back"},
    {who:"paula", q:"Is he lying to you?", a:"He swears it's all true. He gets upset if I correct him.", clue:"Believes his false stories"},
    {who:"gh", q:"Repeat these numbers: 5-8-2-9-6.", a:"5-8-2-9-6.", clue:"Spared: immediate attention span", spared:true},
    {who:"gh", q:"Tell me about your first job.", a:"Welding at the shipyard, 1987. Foreman was a guy named Ray.", clue:"Older memories better preserved", note:"(Paula confirms it's accurate.)"}
   ]},
  {type:"q", label:"Domains", multi:true, cat:"memory",
   prompt:"Which functions look impaired? Select all that apply.",
   hint:"Compare yesterday, the 1980s, and how sure he is of himself.",
   options:[
    {t:"Learning new information", ok:true, why:"Yes."},
    {t:"Memory for the years before his illness (worse for recent years)", ok:true, why:"Yes. A temporally graded retrograde amnesia."},
    {t:"Monitoring the accuracy of his own memories", ok:true, why:"Yes. Confabulation reflects poor monitoring."},
    {t:"Language", ok:false, why:"Spared."},
    {t:"Motor skill learning", ok:false, why:"Procedural learning is usually spared."}
   ],
   explain:{title:"Korsakoff syndrome", body:["Korsakoff syndrome follows thiamine deficiency, usually with chronic alcohol use, often after an acute Wernicke encephalopathy (confusion, unsteady gait, eye-movement problems). It combines anterograde amnesia, graded retrograde amnesia and confabulation."], src:[T18]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests do you order?",
   hint:"New learning, old memories by decade, frontal signs, and one classic Korsakoff task.",
   options:[
    {t:"Wechsler Memory Scale", ok:true, why:"Yes."},
    {t:"Famous-events test across decades", ok:true, why:"Yes. Reveals the temporal gradient."},
    {t:"Executive tests (WCST, fluency)", ok:true, why:"Yes. Frontal signs are common in Korsakoff."},
    {t:"Release from proactive interference", ok:true, why:"Yes. Korsakoff patients fail to benefit when the word category changes."},
    {t:"Token Test", ok:false, why:"Not targeted."},
    {t:"Finger Tapping", ok:false, why:"Not targeted."}
   ],
   explain:{title:"Profiling the amnesia", body:["Comparing new learning, remote memory and executive signs distinguishes diencephalic amnesia from medial temporal amnesia."], src:[T18]}},
  {type:"results", label:"Results",
   rows:[
    ["WMS Delayed Memory Index","New learning","62","imp","Severe",0],
    ["Famous events","Remote memory","1960s–70s: 85% · 1990s–2000s: 20%","imp","Temporal gradient",1],
    ["Wisconsin Card Sorting Test","Set shifting","3 categories; perseverative","low","Frontal signs",2],
    ["Verbal fluency","Generativity","Low average","low","",2],
    ["Release from proactive interference","Encoding","No release","imp","No benefit from category change",3],
    ["WAIS-IV FSIQ","General intellect","97","avg","Normal"]
   ],
   scale:"Index: mean 100, SD 15.",
   pattern:"Severe new-learning failure, worse memory for recent decades than early life, and frontal-type signs. A different profile from H.M.'s pure medial temporal amnesia."},
  {type:"q", label:"Localize", multi:false, cat:"memory", map:true,
   prompt:"Point to the damage. Try the medial view.",
   hint:"Deep in the middle of the brain, below the corpus callosum, part of the circuit linking the hippocampus to frontal cortex.",
   options:[
    {t:"Mammillary bodies and mediodorsal thalamus (diencephalon)", region:["mamm","thal"], side:"B", ok:true, why:"Correct. Thiamine deficiency damages these structures; the mediodorsal thalamus links to prefrontal cortex, explaining the frontal signs."},
    {t:"Hippocampus, both sides", region:"hippo", side:"B", ok:false, why:"Medial temporal amnesia (like H.M.) usually lacks confabulation and frontal signs."},
    {t:"Cerebellum", region:"cereb", side:"B", ok:false, why:"Explains the unsteady gait in the Wernicke phase, not the amnesia."},
    {t:"Orbitofrontal cortex alone", region:"ofc", side:"B", ok:false, why:"Contributes to confabulation but doesn't cause dense amnesia."},
    {t:"Amygdala, both sides", region:"amyg", side:"B", ok:false, why:"Affects emotional learning, not this profile."},
    {t:"Wernicke's area", region:"wernicke", ok:false, why:"Despite the name, Wernicke encephalopathy has nothing to do with Wernicke's area."}
   ],
   explain:{title:"Diencephalic amnesia", body:["The mammillary bodies and mediodorsal thalamus are part of the circuit linking hippocampus and frontal cortex. Damage gives amnesia plus frontal-type problems, including poor release from proactive interference (Butters & Cermak)."], src:[T18, "Butters & Cermak (1980)"]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"His sister says he's lying. Is he?",
   hint:"Does he know his stories are false?",
   options:[
    {t:"Yes, he's deliberately deceiving her", ok:false, why:"He believes what he says."},
    {t:"No. Confabulation is honest: false memories from faulty retrieval and poor self-monitoring", ok:true, why:"Correct."},
    {t:"He's psychotic", ok:false, why:"No other psychotic features; confabulation is tied to memory."},
    {t:"He's joking", ok:false, why:"He's upset when corrected."}
   ],
   explain:{title:"Honest lying", body:["Confabulations are often real memories put in the wrong time, like the trips with his brother. Damaged frontal monitoring lets the errors through."], src:[T18]}},
  {type:"end", label:"Case closed",
   dx:"Korsakoff syndrome: diencephalic amnesia with confabulation after thiamine deficiency",
   next:["Continue thiamine; support abstinence from alcohol.","Structured routine and external memory aids.","Redirect confabulations gently instead of arguing.","Assess capacity and supervision needs."],
   pearl:"Not all amnesia is hippocampal. The diencephalon is part of the memory circuit too.",
   refs:[T18, "Butters & Cermak (1980)"]}
  ]},
/* ============ 20 AMYGDALA ============ */
{ id:"case-20", no:"NP-20", tag:"Emotion", cat:"emotion", patient:"nk", r:-1.5,
  title:"The Woman Who Isn't Afraid",
  short:"She walks up to strangers, hands out her bank card, and says she has never felt fear.",
  cw:["Ch. 20 Emotion (with Ch. 22 links)","Amygdala and fear, fear recognition, conditioning vs. declarative memory (Bechara et al., 1995), attention to the eyes","Facial emotion recognition, fear conditioning with skin conductance, trustworthiness ratings"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"Her social worker is worried she'll get badly hurt. Find out why she keeps walking into danger.",
   id:[["Patient","N.K."],["Age","38"],["Handedness","Right"],["Education","14 yrs"],["Job","Bookkeeper"]],
   referral:"Repeated victimization: scams, unsafe situations, approaching strangers. Is there a neuropsychological explanation?",
   history:["N.K. has a rare genetic skin and throat condition; her voice has always been hoarse. Her intelligence has always been average."]},
  {type:"interview", label:"Interview", cast:["nk","bea"],
   qs:[
    {who:"nk", q:"When did you last feel afraid?", a:"Afraid? Honestly, I don't think I ever have. Surprised, sure. Curious.", clue:"Reports never feeling fear"},
    {who:"nk", q:"What did you do this morning?", a:"Bus to work, then here. Same as every Tuesday.", clue:"Spared: memory", spared:true},
    {who:"bea", q:"What worries you most?", a:"She'll walk up to anyone. She gave her bank card to a man at a bus stop because he 'seemed nice.'", clue:"Trusts strangers too easily"},
    {who:"nk", q:"How does this person feel? (A frightened face)", a:"Surprised? Maybe confused.", clue:"Can't recognize fear in faces"},
    {who:"bea", q:"Can she tell when someone is happy or sad?", a:"Oh yes. She knows I'm down before I say a word.", clue:"Spared: recognizing happiness and sadness", spared:true},
    {who:"bea", q:"Anything else?", a:"At the pet store she picked up a snake they told her not to touch. She just laughed.", clue:"Approaches danger"}
   ]},
  {type:"q", label:"Domains", multi:true, cat:"emotion",
   prompt:"Which functions look impaired? Select all that apply.",
   hint:"It's one emotion in particular, plus what follows from it.",
   options:[
    {t:"Experiencing fear", ok:true, why:"Yes."},
    {t:"Recognizing fear in others' faces", ok:true, why:"Yes."},
    {t:"Judging who is trustworthy", ok:true, why:"Yes."},
    {t:"Recognizing happiness", ok:false, why:"Typically spared."},
    {t:"Memory", ok:false, why:"No evidence of a problem."},
    {t:"General intelligence", ok:false, why:"Average, as always."}
   ],
   explain:{title:"Fear and the amygdala", body:["The amygdala is central to detecting threat, fear learning and recognizing fear in others. Other emotions are comparatively intact after amygdala damage."], src:[T20]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests do you order?",
   hint:"Test recognition, automatic fear learning, and social judgment, plus a memory control.",
   options:[
    {t:"Facial emotion recognition (all basic emotions)", ok:true, why:"Yes."},
    {t:"Fear conditioning with skin conductance", ok:true, why:"Yes. Measures automatic fear learning."},
    {t:"Trustworthiness ratings of faces", ok:true, why:"Yes."},
    {t:"Wechsler Memory Scale", ok:true, why:"Yes, as a control: is memory normal?"},
    {t:"Wisconsin Card Sorting Test", ok:false, why:"Not targeted."},
    {t:"Token Test", ok:false, why:"Not targeted."}
   ],
   explain:{title:"Testing emotion", body:["Pair emotional measures with a memory control so you can separate feeling from knowing."], src:[T20]}},
  {type:"results", label:"Results",
   rows:[
    ["Facial emotion recognition","Emotion recognition","Fear 2/10; happy, sad, disgust normal","imp","Fear selectively impaired",0],
    ["Eye tracking during faces","Attention to faces","Rarely looks at the eyes","low","",0],
    ["Fear conditioning (skin conductance)","Automatic fear learning","No response to conditioned tone","imp","Yet she can state which tone came before the noise",1],
    ["Trustworthiness ratings","Social judgment","Rates untrustworthy faces as trustworthy","imp","",2],
    ["WMS","Memory","Normal","avg","Control intact",3]
   ],
   scale:"Raw scores.",
   pattern:"She can state the rule ('the blue tone came before the noise'), but her body never learned to fear it. She misreads fear, and her eyes skip the part of the face that signals it."},
  {type:"q", label:"Localize", multi:false, cat:"emotion", map:true,
   prompt:"Point to the damage. Use the medial view.",
   hint:"A small almond-shaped structure at the front of the medial temporal lobe, on both sides.",
   options:[
    {t:"Amygdala, both hemispheres", region:"amyg", side:"B", ok:true, why:"Correct. Her condition (Urbach–Wiethe disease) can calcify both amygdalae; CT confirms it here."},
    {t:"Hippocampus, both hemispheres", region:"hippo", side:"B", ok:false, why:"Hippocampal patients show the reverse: conditioned skin response intact, but they can't state the rule."},
    {t:"Orbitofrontal cortex", region:"ofc", side:"B", ok:false, why:"Affects decision-making and social behavior, but fear recognition depends on the amygdala."},
    {t:"Anterior insula", region:"insula", side:"B", ok:false, why:"Insula damage impairs disgust; hers is normal."},
    {t:"Right fusiform gyrus", region:"fusiform", side:"R", ok:false, why:"Would impair face identity, not fear."},
    {t:"Anterior cingulate cortex", region:"acc", side:"B", ok:false, why:"Conflict monitoring and the motivational side of pain, not this profile."}
   ],
   explain:{title:"A double dissociation", body:["Bechara et al. (1995): an amygdala patient failed to acquire a conditioned skin response but could state the pairing; a hippocampal patient showed the reverse."], src:[T20, "Bechara et al. (1995)"]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"When told to look at the eyes, her fear recognition jumps to near normal. What does that suggest?",
   hint:"Is the problem seeing the face, or where her attention goes?",
   options:[

    {t:"Her eyesight is poor", ok:false, why:"Vision is normal."},
    {t:"She was faking", ok:false, why:"The pattern is consistent and well documented."}
   ],
   explain:{title:"Emotion steers attention", body:["Adolphs et al. (2005) found exactly this. It links Chapter 20 to Chapter 22: invisible fearful faces still drive the amygdala (Jiang & He, 2006), and the amygdala helps decide what we attend to."], src:[T20, L_22, "Adolphs et al. (2005)"]}},
  {type:"end", label:"Case closed",
   dx:"Selective impairment of fear and fear recognition from bilateral amygdala damage (Urbach–Wiethe disease)",
   next:["Safety planning: trusted contacts; rules for strangers and money.","Explicit coaching ('look at the eyes'); rules for spotting danger.","Social work support."],
   pearl:"Knowing that something is dangerous and feeling that it is dangerous rely on different systems.",
   refs:[T20, "Bechara et al. (1995)", "Adolphs et al. (2005)"]}
  ]},

{ id:"case-22", no:"NP-22", tag:"Disconnection · language", cat:"language", patient:"lj", r:-2,
  title:"Every Word but the One You Asked For",
  short:"He talks fluently and understands everything. Ask him to repeat a sentence and it falls apart.",
  cw:["Ch. 17 Disconnection Syndromes; Ch. 19 Language","Conduction aphasia, arcuate fasciculus, dorsal language stream, conduite d'approche","Sentence repetition, Token Test, Boston Naming, picture description, digit span"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"A fluent talker with a very specific problem. Pin down exactly what he can't do.",
   id:[["Patient","L.J."],["Age","61"],["Handedness","Right"],["Education","16 yrs"],["Job","Retired engineer"]],
   referral:"Speech errors after a small stroke 3 weeks ago. Characterize the language problem.",
   history:["L.J. had a small left-hemisphere stroke. No weakness. His wife says his conversation is 'nearly normal'."]},
  {type:"interview", label:"Interview", cast:["lj","sue"],
   qs:[
    {who:"lj", q:"Tell me about your weekend.", a:"We drove up to the lake… the, uh, the cabin. I fixed the dock. Good weekend.", clue:"Fluent, meaningful conversation", react:["sue","That's right. He spent all Saturday on that dock."]},
    {who:"lj", q:"Repeat after me: 'The president lives in Washington.'", a:"The president… lives in… Wash… Wishington? The man who runs the country lives in the capital.", clue:"Can't repeat, but gives the meaning"},
    {who:"lj", q:"Point to the ceiling, then the door.", a:"(Points to the ceiling, then the door.)", clue:"Spared: comprehension", spared:true},
    {who:"lj", q:"What's this? (A stethoscope)", a:"A stethe… a stoth… stethoscope. Phew.", clue:"Sound errors he keeps trying to fix"},
    {who:"sue", q:"What's changed?", a:"He knows exactly what he wants to say. Little words come out scrambled and he keeps trying to fix them.", clue:"Aware of errors; self-corrects"},
    {who:"lj", q:"What's 12 times 4?", a:"48.", clue:"Spared: calculation", spared:true}
   ]},
  {type:"q", label:"Domains", multi:true, cat:"language",
   prompt:"Which aspects of language look impaired? Select all that apply.",
   hint:"He understands and talks fluently. What fails when he has to reproduce exact words?",
   options:[
    {t:"Repeating exact words and sentences", ok:true, why:"Yes. His hallmark: he gives the meaning but not the words."},
    {t:"Producing the right speech sounds within words (phonemic errors)", ok:true, why:"Yes. 'Stethe… stoth…' are phonemic paraphasias, with repeated attempts to fix them (conduite d'approche)."},
    {t:"Comprehension", ok:false, why:"Spared. He follows commands."},
    {t:"Fluency", ok:false, why:"Spared. His conversation flows."},
    {t:"Awareness of his errors", ok:false, why:"Spared. He hears his mistakes and tries to fix them."}
   ],
   explain:{title:"Conduction aphasia", body:["Conduction aphasia combines fluent speech and good comprehension with poor repetition and phonemic errors. Patients usually know they've made a mistake."], src:[T19]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests do you order?",
   hint:"Measure repetition directly, confirm comprehension and fluency, and check naming.",
   options:[
    {t:"Sentence repetition", ok:true, why:"Yes. The key test."},
    {t:"Token Test", ok:true, why:"Yes, to show comprehension is intact."},
    {t:"Boston Naming Test", ok:true, why:"Yes. Shows phonemic errors in naming."},
    {t:"Picture description (Cookie Theft)", ok:true, why:"Yes. Documents fluent connected speech."},
    {t:"Wisconsin Card Sorting Test", ok:false, why:"Not targeted."},
    {t:"Rey delayed recall", ok:false, why:"Not targeted."}
   ],
   explain:{title:"Profiling an aphasia", body:["Fluency, comprehension, repetition and naming together classify an aphasia. Here repetition is the outlier."], src:[T19]}},
  {type:"results", label:"Results",
   rows:[
    ["Sentence repetition","Repetition","3 / 10","imp","Worse for long sentences and non-words",0],
    ["Token Test","Comprehension","34 / 36","avg","Normal",1],
    ["Boston Naming Test","Naming","44 / 60","low","Phonemic errors, repeated self-corrections",2],
    ["Picture description","Fluency","120 words/min","avg","Fluent, grammatical",3],
    ["Digit span forward","Verbal short-term memory","4 digits","low","Reduced phonological store"]
   ],
   scale:"Raw scores.",
   pattern:"Fluent speech and normal comprehension, but he can't reproduce exact sound sequences: repetition, non-words, and digit strings all suffer."},
  {type:"q", label:"Localize", multi:false, cat:"language", map:true,
   prompt:"Point to it on the brain map.",
   hint:"The damage isn't in either classic language area. It's in what connects them.",
   options:[
    {t:"Left arcuate fasciculus and supramarginal gyrus", region:["arcuate","ipl"], ok:true, why:"Correct. Damage here disconnects posterior (sound) from anterior (articulation) language regions."},
    {t:"Left posterior superior temporal gyrus (Wernicke's area)", region:"wernicke", ok:false, why:"Would impair comprehension."},
    {t:"Left inferior frontal gyrus (Broca's area)", region:"broca", ok:false, why:"Would make speech effortful and nonfluent."},
    {t:"Right arcuate fasciculus", region:"arcuate", side:"R", ok:false, why:"In right-handers, language is usually left-lateralized."},
    {t:"Primary auditory cortex, both sides", region:"a1", side:"B", ok:false, why:"Would cause word deafness."},
    {t:"Left angular gyrus", region:"angular", ok:false, why:"Associated with reading, writing and calculation; his calculation is fine."}
   ],
   explain:{title:"A disconnection between language areas", body:["In the Wernicke–Geschwind model, the arcuate fasciculus links Wernicke's and Broca's areas; cutting it spares both but blocks repetition (Geschwind, 1965).","Modern dual-stream models place repetition in a dorsal route from sound to articulation, through the supramarginal gyrus and arcuate fasciculus (Hickok & Poeppel, 2007)."], src:[T17, T19, "Geschwind (1965); Hickok & Poeppel (2007)"]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"Why can he give the meaning of a sentence but not repeat its words?",
   hint:"Understanding and repeating may travel different routes.",
   options:[
    {t:"Meaning is extracted by an intact ventral route; verbatim repetition needs the dorsal sound-to-articulation route he lost", ok:true, why:"Correct."},
    {t:"He's not paying attention", ok:false, why:"He tries hard and knows when he's wrong."},
    {t:"His hearing is poor", ok:false, why:"He understands everything."},
    {t:"He has a memory disorder", ok:false, why:"His episodic memory is fine; only short sound sequences suffer."}
   ],
   explain:{title:"Two routes for language", body:["The ventral stream maps sound to meaning; the dorsal stream maps sound to speech movements. Conduction aphasia is a dorsal-stream disconnection."], src:[T19, "Hickok & Poeppel (2007)"]}},
  {type:"end", label:"Case closed",
   dx:"Conduction aphasia after a left supramarginal / arcuate fasciculus stroke",
   next:["Speech therapy focused on repetition and phonological practice.","Reassure: conversation and comprehension are largely intact.","Re-assess in 3 months."],
   pearl:"Some aphasias come from cut connections. If repetition alone fails, look at the pathway, not the centers.",
   refs:[T17, T19, "Geschwind (1965)"]}
  ]},

{ id:"case-23", no:"NP-23", tag:"Disconnection · movement", cat:"lateral", patient:"ac", r:2,

  steps:[
  {type:"intro", label:"Case file",
   brief:"One hand works, the other doesn't, and it isn't weakness. Work out why.",
   id:[["Patient","A.C."],["Age","57"],["Handedness","Right"],["Education","17 yrs"],["Job","Pharmacist"]],
   referral:"Left-hand clumsiness after a stroke 3 weeks ago. Strength is normal. Explain.",

    {who:"ac", q:"Write your name with your left hand.", a:"(Produces scrawls with no recognizable letters.)", clue:"Left-hand writing is meaningless, not just clumsy", react:["leo","She used to print notes with her left hand when her right was busy. Neat enough to read."]},
    {who:"ac", q:"(Eyes closed, a key in her left hand) What are you holding?", a:"I have no idea.", clue:"Can't name objects in the left hand"},

  {type:"q", label:"Domains", multi:true, cat:"lateral",
   prompt:"Which functions look impaired? Select all that apply.",

   options:[
    {t:"Skilled movement (praxis) with the left hand", ok:true, why:"Yes. Left-hand apraxia."},

    {t:"Language", ok:false, why:"Spared."}
   ],

   options:[

    {t:"Tactile naming with each hand", ok:true, why:"Yes."},
    {t:"Finger Tapping / grip strength", ok:true, why:"Yes, to rule out weakness."},
    {t:"Wisconsin Card Sorting Test", ok:false, why:"Not targeted."},
    {t:"Rey delayed recall", ok:false, why:"Not targeted."}
   ],
   explain:{title:"Hand-by-hand testing", body:["Disconnection signs show up as differences between the hands. Each task should be done with both."], src:[T17]}},
  {type:"results", label:"Results",
   rows:[
    ["Pantomime to command","Praxis","Right 19/20 · Left 5/20","imp","Left: body-part-as-object, wrong movements",0],
    ["Imitating your movements","Praxis","Left hand improves to 12/20","low","Copying helps a little",0],
    ["Writing to dictation","Writing","Right normal · Left illegible","imp","",1],
    ["Tactile naming","Touch recognition","Right 10/10 · Left 2/10","imp","Left hand picks the object from a pile",2],
    ["Finger tapping / grip","Strength, speed","Normal both hands","avg","",3]
   ],
   scale:"Raw scores.",
   pattern:"Every left-hand task that depends on the left hemisphere's language or movement plans fails, yet the left hand is strong and can pick out objects it can't name."},
  {type:"q", label:"Localize", multi:false, cat:"lateral", map:true,
   prompt:"Point to the damage. Use the medial view.",
   hint:"The fibers that carry movement commands between the hemispheres run through the front and middle of a midline structure.",
   options:[
    {t:"Anterior corpus callosum (genu and body)", region:"ccant", side:"B", ok:true, why:"Correct. Commands from the left hemisphere can't cross to the right hemisphere that moves the left hand."},
    {t:"Splenium of the corpus callosum", region:"splenium", side:"B", ok:false, why:"The splenium carries visual information; damage gives reading and visual-naming disconnections, not left-hand apraxia."},

  {type:"end", label:"Case closed",

/* ============ 24 PURE WORD DEAFNESS ============ */
{ id:"case-24", no:"NP-24", tag:"Disconnection · hearing", cat:"language", patient:"pw", r:-1.5,
  title:"She Hears Everything but Words",
  short:"She hears the doorbell and the dog. Spoken words sound like a foreign language.",
  cw:["Ch. 17 Disconnection Syndromes; Ch. 15 Temporal Lobes","Pure word deafness, auditory disconnection from Wernicke's area, environmental sounds","Audiometry, environmental sounds, Token Test (spoken vs. written), naming"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"Her ears test normal. Her language tests normal on paper. Yet she can't understand you. Find out why.",
   id:[["Patient","P.W."],["Age","45"],["Handedness","Right"],["Education","18 yrs"],["Job","Legal translator"]],
   referral:"Can't understand speech since a stroke two weeks ago. Hearing test normal.",
   history:["P.W. had a small right temporal stroke a year ago with little effect. Two weeks ago she had a second stroke, in the left temporal lobe."]},
  {type:"interview", label:"Interview", cast:["pw","dev"],
   qs:[
    {who:"pw", q:"How are you feeling today?", a:"Sorry? …It sounds like a foreign language. Can you write it down?", clue:"Speech sounds like a foreign language"},
    {who:"pw", q:"(You write it down: How are you feeling today?)", a:"Oh! Frustrated, honestly. I can read you perfectly.", clue:"Spared: reads and answers written questions", spared:true},
    {who:"dev", q:"What's changed at home?", a:"She hears the doorbell, the dog, the kettle. But when I talk, she stares at my lips.", clue:"Recognizes environmental sounds; lip-reads"},
    {who:"pw", q:"(In writing) Tell me about your work.", a:"I translate legal documents, French and Spanish. Or I did. Hard to work when nobody makes sense.", clue:"Spared: fluent, normal speech", spared:true},
    {who:"pw", q:"Repeat after me: 'The cat sat on the mat.'", a:"(Watches your lips.) The… cat? Sorry, I can't.", clue:"Can't repeat speech"}
   ]},
  {type:"q", label:"Domains", multi:true, cat:"language",
   prompt:"What looks impaired? Select all that apply.",
   hint:"She reads, writes, talks and hears sounds. What's left?",
   options:[
    {t:"Understanding spoken words", ok:true, why:"Yes."},
    {t:"Repeating spoken words", ok:true, why:"Yes, because she can't perceive them as words."},
    {t:"Reading", ok:false, why:"Spared."},
    {t:"Speaking", ok:false, why:"Spared."},
    {t:"Hearing non-speech sounds", ok:false, why:"Spared: doorbell, dog, kettle."}
   ],
   explain:{title:"Pure word deafness", body:["Speech comprehension fails while hearing, reading, writing and speaking are intact. The language system works; spoken input can't reach it."], src:[T17]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests do you order?",
   hint:"Check hearing and non-speech sounds, then compare spoken and written language.",
   options:[
    {t:"Pure-tone audiometry", ok:true, why:"Yes. Rules out peripheral hearing loss."},
    {t:"Environmental sound recognition", ok:true, why:"Yes. Shows non-speech hearing is intact."},
    {t:"Token Test, spoken and written versions", ok:true, why:"Yes. The contrast is the key finding."},
    {t:"Boston Naming Test", ok:true, why:"Yes. Normal naming shows there's no aphasia."},
    {t:"Wisconsin Card Sorting Test", ok:false, why:"Not targeted."},
    {t:"Finger Tapping", ok:false, why:"Not targeted."}
   ],
   explain:{title:"Isolating the input channel", body:["Comparing the same test in two modalities (spoken vs. written) is the classic way to reveal a disconnection."], src:[T17]}},
  {type:"results", label:"Results",
   rows:[
    ["Pure-tone audiometry","Hearing","Normal","avg","",0],
    ["Environmental sounds","Non-speech hearing","18 / 20","avg","Recognizes bells, animals, traffic",1],
    ["Token Test, spoken","Auditory comprehension","10 / 36","imp","",2],
    ["Token Test, written","Reading comprehension","35 / 36","avg","",2],
    ["Boston Naming Test","Naming","56 / 60","avg","Normal",3],
    ["Sentence repetition","Repetition","1 / 10","imp","Can't perceive the words"]
   ],
   scale:"Raw scores.",
   pattern:"Same test, two modalities: written comprehension is normal, spoken comprehension fails. Hearing and non-speech sounds are fine."},
  {type:"q", label:"Localize", multi:false, cat:"language", map:true,
   prompt:"Point to the damage. Remember she has had two strokes.",
   hint:"Sound has to get from auditory cortex to the language areas. Where could both routes have been cut?",
   options:[
    {t:"Primary auditory cortex and nearby superior temporal gyrus, both sides", region:"a1", side:"B", ok:true, why:"Correct. With both auditory regions damaged (or cut off), speech sounds can't reach Wernicke's area."},
    {t:"Wernicke's area (left)", region:"wernicke", ok:false, why:"Wernicke's aphasia would also impair reading and speech."},
    {t:"Right primary auditory cortex only", region:"a1", side:"R", ok:false, why:"One side isn't enough: the left auditory cortex would still connect to language areas. Her first stroke caused little trouble for this reason."},
    {t:"Left arcuate fasciculus", region:"arcuate", ok:false, why:"Causes conduction aphasia: comprehension intact."},
    {t:"Left angular gyrus", region:"angular", ok:false, why:"Would affect reading and writing."},
    {t:"Broca's area", region:"broca", ok:false, why:"Would affect speech output."}
   ],
   explain:{title:"Auditory disconnection", body:["Pure word deafness follows bilateral superior temporal damage, or a deep left lesion that cuts both auditory inputs to Wernicke's area. The language system is intact but deprived of spoken input (Geschwind, 1965)."], src:[T17, T15, "Geschwind (1965)"]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"How should her family communicate with her?",
   hint:"Use the routes that still reach her language system.",
   options:[
    {t:"Writing, texting, captions and gestures, plus facing her so she can lip-read", ok:true, why:"Correct. Written and visual input reach her intact language system."},

    {t:"Avoid communicating until she recovers", ok:false, why:"Isolation would make things worse."}
   ],
   explain:{title:"Using the intact routes", body:["Knowing which routes are disconnected tells you which ones to use. Speech-to-text apps can be transformative."], src:[T17]}},
  {type:"end", label:"Case closed",
   dx:"Pure word deafness after bilateral superior temporal strokes",

{ id:"case-25", no:"NP-25", tag:"Disconnection · ventral stream", cat:"perception", patient:"fr", r:2.5,

  steps:[

    {t:"Parieto-occipital cortex (dorsal stream)", region:"dorsal", side:"B", ok:false, why:"Would affect reaching and spatial attention."},
    {t:"Calcarine cortex (V1), both sides", region:"calc", side:"B", ok:false, why:"Would cause cortical blindness."},

   explain:{title:"A ventral stream disconnection", body:["Associative agnosia usually follows bilateral occipitotemporal damage that separates visual processing from the temporal-lobe stores of meaning. Upper-field defects fit damage below the calcarine fissure."], src:[T13, T17]}},

{ id:"case-26", no:"NP-26", tag:"Disconnection · dorsal stream", cat:"perception", patient:"rs", r:-2.5,
  title:"Missing the Cup",
  short:"She sees the cup perfectly. When she reaches for it without looking straight at it, her hand misses.",
  cw:["Ch. 14 Parietal Lobes; Ch. 13 (two streams)","Optic ataxia, dorsal stream (vision for action), field and hand effects, double dissociation with agnosia","Reaching by hand and field, cancellation, visual fields, strength"],
  steps:[
  {type:"intro", label:"Case file",
   brief:"Vision fine, strength fine, recognition fine. Yet she keeps knocking things over.",
   id:[["Patient","R.S."],["Age","49"],["Handedness","Right"],["Education","14 yrs"],["Job","Dental hygienist"]],

  {type:"interview", label:"Interview", cast:["rs","kim"],

    {who:"rs", q:"What's on the table to your left?", a:"A cup, a pen, and your notebook.", clue:"Spared: sees and names things on the left (no neglect)", spared:true},
    {who:"rs", q:"Reach for my pen while looking at my nose. (Pen on her left)", a:"(Her hand lands several centimeters off, then gropes for it.)", clue:"Misreaches without looking directly"},
    {who:"rs", q:"Tell me about your work.", a:"Cleanings, mostly. Twelve years at the same practice.", clue:"Spared: memory and language", spared:true, react:["kim","Her patients keep asking when she's coming back."]}

  {type:"q", label:"Domains", multi:true, cat:"perception",
   prompt:"What looks impaired? Select all that apply.",

    {t:"Recognizing objects", ok:false, why:"Spared."},
    {t:"Basic vision", ok:false, why:"Normal."},
    {t:"Strength", ok:false, why:"Normal."}
   ],
   explain:{title:"Optic ataxia", body:["Optic ataxia is misreaching to visual targets, usually in the field opposite the lesion and worse when not looking directly at the target, without weakness or field loss."], src:[T14]}},
  {type:"q", label:"Order tests", multi:true, cat:"assessment", tests:true,
   prompt:"Open the test kit. Which tests do you order?",

    {t:"Wisconsin Card Sorting Test", ok:false, why:"Not targeted."}
   ],
   explain:{title:"Ruling out the look-alikes", body:["Neglect, hemianopia and weakness can all make someone miss things on one side. Each needs ruling out."], src:[T14]}},
  {type:"results", label:"Results",
   rows:[
    ["Reaching, left field","Visuomotor guidance","Errors 4–6 cm, both hands","imp","Worst with the left hand",0],
    ["Reaching, looking directly at target","Visuomotor guidance","Near normal","avg","",0],

    ["Grip / tapping","Strength","Normal","avg","",3]
   ],

   pattern:"Pure misreaching in the left peripheral field, with normal attention, fields and strength."},
  {type:"q", label:"Localize", multi:false, cat:"perception", map:true,
   prompt:"Point to it on the brain map.",
   hint:"The 'vision for action' stream, upper back of the brain, on the side opposite the affected field.",
   options:[
    {t:"Right superior parietal lobule / intraparietal sulcus (dorsal stream)", region:"spl", side:"R", ok:true, why:"Correct. Visual information can't guide the arm toward the left field."},
    {t:"Right temporoparietal junction", region:"tpj", side:"R", ok:false, why:"Would cause neglect; she has none."},

    {t:"Superior parietal and parieto-occipital cortex, both sides", region:["spl","dorsal"], side:"B", ok:false, why:"Would add simultanagnosia and gaze problems: Bálint's syndrome."},
    {t:"Right calcarine cortex", region:"calc", side:"R", ok:false, why:"Would cause a left field cut."}
   ],
   explain:{title:"The dorsal stream for action", body:["Perenin and Vighetto (1988) linked optic ataxia to superior parietal and intraparietal damage. The visual signal reaches awareness through the ventral stream, but can't be transformed into a reach."], src:[T14, "Perenin & Vighetto (1988)"]}},
  {type:"q", label:"Context", multi:false, cat:"reasoning",
   prompt:"How does R.S. compare with D.F.-type agnosia (case NP-07)?",

  ]},

{ id:"case-27", no:"NP-27", tag:"Autoimmune · white matter", cat:"attention", patient:"em", r:1.5,

  cw:["Neurological disorders (autoimmune); Ch. 17 (disconnection via white matter); Neuroimaging (DTI)","Multiple sclerosis, demyelination, processing speed, fatigue, lesion load vs. function","Symbol Digit Modalities Test, PASAT, WMS, fatigue and mood measures"],
  steps:[
  {type:"intro", label:"Case file",

{ id:"case-28", no:"NP-28", tag:"Autoimmune encephalitis", cat:"reasoning", patient:"ys", r:-2,

const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
function drawShift(){
 const unseen = shuffle(CASES.filter(c=>!S.seen.includes(c.id)).map(c=>c.id));
 const rest = shuffle(CASES.filter(c=>S.seen.includes(c.id)).map(c=>c.id));
 if(unseen.length<5) S.seen = [];
 S.shift = [...unseen, ...rest].slice(0,5);
 S.answers={}; S.asked={}; S.progress={}; save();
}
if(!Array.isArray(S.shift) || S.shift.length!==5 || !S.shift.every(id=>CASES.some(c=>c.id===id))) drawShift();
const shiftCases = () => S.shift.map(id=>CASES.find(c=>c.id===id));
function ans(cid,i){ S.answers[cid] ??= {}; return S.answers[cid][i] ??= {sel:[], done:false, score:0, hint:false, hemi:null}; }

const caseScores = c => c.steps.map((s,i)=>s.type==="q"?{s,i,a:S.answers[c.id]?.[i]}:null).filter(Boolean);
const casePct = c => Math.round(100*mean(caseScores(c).map(x=>x.a?.score||0)));
function letter(p){ return p>=93?"A":p>=90?"A−":p>=87?"B+":p>=83?"B":p>=80?"B−":p>=77?"C+":p>=73?"C":p>=70?"C−":p>=60?"D":"F"; }

function scoreQ(step, sel){
 if(!step.multi) return step.options[sel[0]]?.ok ? 1 : 0;
 const good = step.options.filter(o=>o.ok).length; let hit=0, miss=0;
 sel.forEach(i=> step.options[i].ok ? hit++ : miss++);
 return Math.max(0,(hit-miss)/good);

const LVL = {good:"Good addition", maybe:"Could add something", bg:"Useful as background", no:"Probably not useful"};
const hashStr = t => [...t].reduce((h,ch)=>(h*31+ch.charCodeAt(0))>>>0, 7);
const rot = (arr,n,seed) => arr.length ? Array.from({length:Math.min(n,arr.length)},(_,i)=>arr[(seed+i*3)%arr.length]).filter((v,i,x)=>x.indexOf(v)===i) : [];
function extraPool(c,s){
 if(s._pool) return s._pool;
 const inOpts = new Set(s.options.map(o=>testKey(o.t)).filter(Boolean));
 const keys = Object.keys(TESTS).filter(k=>!inOpts.has(k)), seed = hashStr(c.id);
 const groups = CASE_GROUPS[c.id] || DOMAIN_GROUPS[c.cat] || [];
 const good = Object.keys(EXTRA_GOOD[c.id]||{}).filter(k=>keys.includes(k));
 const related = keys.filter(k=>groups.includes(TESTS[k].g) && !good.includes(k));
 const bg = BACKGROUND.filter(k=>keys.includes(k) && !good.includes(k) && !related.includes(k));
 const other = keys.filter(k=>!good.includes(k) && !related.includes(k) && !bg.includes(k));
 s._pool = [...good, ...rot(related,2,seed), ...rot(bg,2,seed+1), ...rot(other,2,seed+2)].sort((x,y)=>TESTS[x].n.localeCompare(TESTS[y].n));
 return s._pool;
}
function reactExtra(c,key){
 const X = TESTS[key], m = X.m.charAt(0).toLowerCase()+X.m.slice(1);
 const g = EXTRA_GOOD[c.id]?.[key]; if(g) return {lvl:"good", msg:`Good thinking. ${g}`};
 const groups = CASE_GROUPS[c.id] || DOMAIN_GROUPS[c.cat] || [];
 if(groups.includes(X.g)) return {lvl:"maybe", msg:`It measures ${m.replace(/\.$/,"")}, which bears on this case, but it adds less than the standard battery. Worth it if the first results leave a question open.`};
 if(BACKGROUND.includes(key)) return {lvl:"bg", msg:`It measures ${m.replace(/\.$/,"")}. That gives useful context, but it doesn't answer the referral question by itself.`};
 return {lvl:"no", msg:`It measures ${m.replace(/\.$/,"")}, which isn't what this referral is asking about. Every test costs the patient time and energy, so keep the battery focused.`};
}
